<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>둘리 (Dooly)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header p { font-size: 12px; opacity: 0.5; margin-top: 2px; }

  /* 채팅 영역 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
  }
  .msg.dooly { align-self: flex-start; }
  .msg.user  { align-self: flex-end; }

  .msg-sender {
    font-size: 11px;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .msg.user .msg-sender { text-align: right; }

  .msg-bubble {
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.dooly .msg-bubble {
    background: #1c2333;
    border-bottom-left-radius: 4px;
  }
  .msg.user .msg-bubble {
    background: #4da3ff;
    color: #0b0f1a;
    font-weight: 600;
    border-bottom-right-radius: 4px;
  }

  /* 입력창 */
  .input-area {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 100px;
    font-family: Arial, sans-serif;
    line-height: 1.4;
  }
  .chat-input::placeholder { opacity: 0.4; }

  .send-btn {
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    width: 48px;
    height: 44px;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:active { opacity: 0.8; }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 10px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 20px; }
</style>
</head>
<body>

<header>
  <h1>Dooly</h1>
  <p>AI 업무 도우미</p>
</header>

<div class="chat-area" id="chatArea"></div>

<div class="input-area">
  <textarea class="chat-input" id="chatInput" placeholder="질문을 입력하세요..." rows="1"
    oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" onclick="sendMessage()">↑</button>
</div>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html" class="active">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
</nav>

<script>
  function mockResponse(input) {
    var text = input.toLowerCase();
    if (text.indexOf('복사기') !== -1) {
      return '복사기 오류 SOP를 확인하세요.';
    }
    if (text.indexOf('복테') !== -1) {
      return '복테 관리 SOP를 확인하세요.';
    }
    if (text.indexOf('연습장') !== -1) {
      return '연습장 관리 SOP를 확인하세요.';
    }
    return '확인이 필요합니다. SOP 또는 FAQ를 검색해보세요.';
  }

  function addMsg(who, text) {
    var area = document.getElementById('chatArea');
    var div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = [
      '<div class="msg-sender">' + (who === 'dooly' ? 'Dooly' : '나') + '</div>',
      '<div class="msg-bubble">' + escHtml(text) + '</div>'
    ].join('');
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function sendMessage() {
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return;

    addMsg('user', text);
    input.value = '';
    input.style.height = '';

    var response = mockResponse(text);
    setTimeout(function() {
      addMsg('dooly', response);
    }, 300);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  addMsg('dooly', '안녕하세요! 무엇이든 질문하세요.');
</script>

</body>
</html>
