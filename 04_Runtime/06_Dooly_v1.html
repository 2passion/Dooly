<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>둘리 (Dooly)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header p { font-size: 12px; opacity: 0.5; margin-top: 2px; }

  /* 채팅 영역 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
  }
  .msg.dooly { align-self: flex-start; }
  .msg.user  { align-self: flex-end; }

  .msg-sender {
    font-size: 11px;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .msg.user .msg-sender { text-align: right; }

  .msg-bubble {
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.dooly .msg-bubble {
    background: #1c2333;
    border-bottom-left-radius: 4px;
  }
  .msg.user .msg-bubble {
    background: #4da3ff;
    color: #0b0f1a;
    font-weight: 600;
    border-bottom-right-radius: 4px;
  }

  /* 입력창 */
  .input-area {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 100px;
    font-family: Arial, sans-serif;
    line-height: 1.4;
  }
  .chat-input::placeholder { opacity: 0.4; }

  .send-btn {
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    width: 48px;
    height: 44px;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:active { opacity: 0.8; }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }

  /* 모델 선택 */
  .model-select-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    background: #1c2333;
    border-bottom: 1px solid rgba(77,163,255,0.1);
    flex-shrink: 0;
  }
  .model-label { font-size: 11px; opacity: 0.5; }
  .model-select {
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 8px;
    color: #4da3ff;
    font-size: 12px;
    padding: 4px 10px;
    outline: none;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .model-select option { background: #0b0f1a; color: #fff; }
  .clear-btn {
    background: transparent;
    border: 1px solid rgba(255,80,80,0.3);
    color: rgba(255,80,80,0.6);
    border-radius: 6px;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .clear-btn:active { background: rgba(255,80,80,0.1); }

  /* 출처 표시 */
  .msg-sources {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .source-tag {
    border-radius: 4px;
    font-size: 10px;
    padding: 2px 7px;
    cursor: default;
  }
  .source-tag.faq { background: rgba(60,200,100,0.1); border: 1px solid rgba(60,200,100,0.3); color: #3cc864; }
  .source-tag.sop { background: rgba(255,180,50,0.1); border: 1px solid rgba(255,180,50,0.3); color: #ffb432; }
  .source-tag.doc { background: rgba(180,130,255,0.1); border: 1px solid rgba(180,130,255,0.3); color: #b482ff; }
</style>
<script src="data.js"></script>
</head>
<body>

<header>
  <h1>Dooly</h1>
  <p>AI 업무 도우미</p>
</header>

<div class="model-select-row">
  <span class="model-label">모델</span>
  <select class="model-select" id="modelSelect">
    <option value="qwen2.5:7b">모델 A — qwen2.5:7b (고품질)</option>
    <option value="qwen2.5:3b">모델 B — qwen2.5:3b (빠름)</option>
    <option value="gemma3:4b">모델 C — gemma3:4b (균형)</option>
  </select>
  <button class="clear-btn" onclick="clearChatHistory()">대화 초기화</button>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="input-area">
  <textarea class="chat-input" id="chatInput" placeholder="질문을 입력하세요..." rows="1"
    oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" onclick="sendMessage()">↑</button>
</div>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="06_Dooly_v1.html" class="active">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
  <a href="07_Settings_v1.html">
    <span class="nav-icon">⚙️</span>
    <span>설정</span>
  </a>
</nav>

<script>
  function mockResponse(input) {
    var text = input.toLowerCase();

    // 1단계: FAQ에서 키워드 매칭 (질문 + keywords 모두 검색)
    var faqMatch = null;
    for (var i = 0; i < FAQS.length; i++) {
      var f = FAQS[i];
      var inQuestion = f.question.toLowerCase().includes(text) || text.includes(f.question.toLowerCase());
      var inKeywords = f.keywords && f.keywords.some(function(k) { return text.includes(k.toLowerCase()); });
      if (inQuestion || inKeywords) { faqMatch = f; break; }
    }
    if (faqMatch) {
      return '[FAQ ' + faqMatch.id + '] ' + faqMatch.question + '\n\n' + faqMatch.answer;
    }

    // 2단계: SOP에서 키워드 매칭 (title + keywords 모두 검색)
    var sopMatch = null;
    for (var j = 0; j < SOPS.length; j++) {
      var s = SOPS[j];
      var inTitle = s.title.toLowerCase().includes(text) || text.includes(s.title.toLowerCase());
      var inSopKeywords = s.keywords && s.keywords.some(function(k) { return text.includes(k.toLowerCase()); });
      if (inTitle || inSopKeywords) { sopMatch = s; break; }
    }
    if (sopMatch) {
      return '[SOP-' + sopMatch.id + '] ' + sopMatch.title + '\n\n' + sopMatch.body;
    }

    // 3단계: 매칭 없음
    return '확인이 필요합니다.\nSOP 또는 FAQ 탭에서 검색해보세요.';
  }
  function addMsgWithId(who, text, id) {
    var area = document.getElementById('chatArea');
    var div = document.createElement('div');
    div.className = 'msg ' + who;
    div.id = id;
    div.innerHTML = [
      '<div class="msg-sender">' + (who === 'dooly' ? 'Dooly' : '나') + '</div>',
      '<div class="msg-bubble">' + escHtml(text) + '</div>'
    ].join('');
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function addMsg(who, text) {
    var area = document.getElementById('chatArea');
    var div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = [
      '<div class="msg-sender">' + (who === 'dooly' ? 'Dooly' : '나') + '</div>',
      '<div class="msg-bubble">' + escHtml(text) + '</div>'
    ].join('');
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  // 현재 접속한 호스트 기준으로 RAG 서버 주소 자동 설정
  // 로컬 파일(file://)로 열면 localhost:8001 사용
  // 서버를 통해 열면 같은 호스트의 8001 포트 사용
  var RAG_SERVER = (location.protocol === 'file:')
    ? 'http://localhost:8001'
    : location.protocol + '//' + location.hostname + ':8001';

  function sendMessage() {
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return;

    addMsg('user', text);
    input.value = '';
    input.style.height = '';

    // 로딩 메시지 표시
    var loadingId = 'loading_' + Date.now();
    addMsgWithId('dooly', '답변을 생성 중입니다...', loadingId);

    // FastAPI 서버 호출
    var selectedModel = document.getElementById('modelSelect').value;

    fetch(RAG_SERVER + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model: selectedModel })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var loadingEl = document.getElementById(loadingId);
      if (loadingEl) {
        loadingEl.querySelector('.msg-bubble').textContent = data.answer;

        saveChatHistory();

        if (data.sources && data.sources.length > 0) {
          var sourcesDiv = document.createElement('div');
          sourcesDiv.className = 'msg-sources';

          var seen = {};
          data.sources.forEach(function(s) {
            var key = s.type + s.label;
            if (seen[key]) return;
            seen[key] = true;

            var tag = document.createElement('span');
            tag.className = 'source-tag ' + s.type.toLowerCase();
            tag.textContent = s.type + ' ' + s.label;
            tag.title = s.file;
            sourcesDiv.appendChild(tag);
          });

          loadingEl.appendChild(sourcesDiv);
          saveChatHistory();
        }
      }
    })
    .catch(function(err) {
      var loadingEl = document.getElementById(loadingId);
      if (loadingEl) {
        loadingEl.querySelector('.msg-bubble').textContent =
          'RAG 서버에 연결할 수 없습니다.\nrun_server.bat 을 실행해주세요.';
      }
    });
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  /* ── 대화 기록 저장/불러오기 ── */
  var CHAT_STORAGE_KEY = 'dooly_chat_history';

  function saveChatHistory() {
    var area = document.getElementById('chatArea');
    if (!area) return;
    localStorage.setItem(CHAT_STORAGE_KEY, area.innerHTML);
  }

  function loadChatHistory() {
    var saved = localStorage.getItem(CHAT_STORAGE_KEY);
    if (!saved) return false;
    var area = document.getElementById('chatArea');
    if (!area) return false;
    area.innerHTML = saved;
    area.scrollTop = area.scrollHeight;
    return true;
  }

  function clearChatHistory() {
    localStorage.removeItem(CHAT_STORAGE_KEY);
    var area = document.getElementById('chatArea');
    if (area) area.innerHTML = '';
    addMsg('dooly', '안녕하세요! 무엇이든 질문하세요.');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 저장된 대화 기록 불러오기, 없으면 초기 메시지
  if (!loadChatHistory()) {
    addMsg('dooly', '안녕하세요! 무엇이든 질문하세요.');
  }
</script>

</body>
</html>
