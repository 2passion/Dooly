<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공지사항</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  .notice-list { display: flex; flex-direction: column; gap: 8px; }

  .notice-item {
    background: #1c2333;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .notice-header {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .notice-left {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }

  .notice-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }

  .notice-date {
    font-size: 12px;
    opacity: 0.5;
  }

  .notice-arrow {
    font-size: 14px;
    opacity: 0.5;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .notice-item.open .notice-arrow { transform: rotate(180deg); }

  .notice-detail {
    display: none;
    padding: 0 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 12px;
  }
  .notice-item.open .notice-detail { display: block; }

  .data-btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .btn-download { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
  .btn-upload   { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }

  .drag-handle {
    color: rgba(255,255,255,0.2);
    font-size: 18px;
    cursor: grab;
    padding-right: 10px;
    flex-shrink: 0;
    user-select: none;
  }
  .dragging {
    opacity: 0.4;
    background: #263045 !important;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }
</style>
</head>
<body>

<header>
  <h1>공지사항</h1>
</header>

<main>
  <div class="data-btn-row">
    <button class="btn-download" onclick="downloadNotices()">📥 JSON 다운로드</button>
    <button class="btn-upload"   onclick="uploadNotices()">📤 JSON 업로드</button>
  </div>
  <div class="notice-list" id="noticeList"></div>
</main>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html" class="active">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
  <a href="07_Settings_v1.html">
    <span class="nav-icon">⚙️</span>
    <span>설정</span>
  </a>
</nav>

<script>
  var NOTICES_DEFAULT = [
    {
      id: 1,
      title: '시스템 오픈 안내',
      date: '2026-06-25',
      body: 'KING Assistant OS v1.0이 오픈되었습니다.\n\n이 시스템은 조교 업무 운영을 지원하기 위한 시스템입니다.\n\n주요 기능:\n- 업무 등록 및 상태 관리\n- SOP 검색\n- FAQ 검색\n- Dooly AI 질의응답\n\n사용 중 문의사항은 담당자에게 문의해 주세요.'
    },
    {
      id: 2,
      title: '조교 업무 매뉴얼 배포',
      date: '2026-06-25',
      body: '조교 업무 매뉴얼이 배포되었습니다.\n\n매뉴얼 내용:\n- 복테 관리 방법\n- 오답노트 관리 방법\n- 비품 관리 방법\n- 복사기 사용 방법\n\n모든 조교는 매뉴얼을 숙지하고 업무에 임해 주세요.\n\n문의사항은 원장에게 직접 문의해 주세요.'
    }
  ];

  var NOTICES = (function() {
    var s = localStorage.getItem('notices');
    return s ? JSON.parse(s) : NOTICES_DEFAULT;
  })();

  var openId = null;

  function toggle(id) {
    openId = openId === id ? null : id;
    render();
  }

  function getToday() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function downloadNotices() {
    downloadJSON(NOTICES, 'notice_' + getToday() + '.json');
  }

  function uploadNotices() {
    uploadJSON(function(data) {
      NOTICES = data;
      localStorage.setItem('notices', JSON.stringify(data));
      openId = null;
      render();
    });
  }

  function downloadJSON(data, filename) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function uploadJSON(callback) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try { callback(JSON.parse(ev.target.result)); }
        catch(err) { alert('JSON 형식이 올바르지 않습니다.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function render() {
    var container = document.getElementById('noticeList');
    container.innerHTML = NOTICES.map(function(n) {
      var isOpen = openId === n.id;
      return [
        '<div class="notice-item' + (isOpen ? ' open' : '') + '" draggable="true" data-id="' + String(n.id) + '" onclick="toggle(' + n.id + ')">',
        '  <div class="notice-header">',
        '    <span class="drag-handle" onclick="event.stopPropagation()">&#10783;</span>',
        '    <div class="notice-left">',
        '      <div class="notice-title">' + escHtml(n.title) + '</div>',
        '      <div class="notice-date">' + n.date + '</div>',
        '    </div>',
        '    <span class="notice-arrow">▼</span>',
        '  </div>',
        '  <div class="notice-detail">' + escHtml(n.body).replace(/\n/g, '<br>') + '</div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addMouseDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('dragstart', function(e) {
      dragEl = e.target.closest('[data-id]');
      if (dragEl) setTimeout(function() { dragEl.classList.add('dragging'); }, 0);
    });
    container.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragEl) return;
      var after = getDragAfterElement(container, e.clientY);
      if (after == null) container.appendChild(dragEl);
      else container.insertBefore(dragEl, after);
    });
    container.addEventListener('dragend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  function getDragAfterElement(container, y) {
    var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
    return items.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function addTouchDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('touchstart', function(e) {
      var handle = e.target.closest('.drag-handle');
      if (!handle) return;
      dragEl = handle.closest('[data-id]');
      if (dragEl) dragEl.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
    container.addEventListener('touchmove', function(e) {
      if (!dragEl) return;
      e.preventDefault();
      var y = e.touches[0].clientY;
      var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
      var after = items.find(function(item) {
        var rect = item.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      });
      if (after) container.insertBefore(dragEl, after);
      else container.appendChild(dragEl);
    }, { passive: false });
    container.addEventListener('touchend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  render();

  var noticeContainer = document.getElementById('noticeList');
  function noticeSaveOrder(newOrder) {
    var allNotices = JSON.parse(localStorage.getItem('notices') || 'null') || NOTICES;
    var sorted = newOrder.map(function(id) {
      return allNotices.find(function(n) { return String(n.id) === id; });
    }).filter(Boolean);
    NOTICES = sorted;
    localStorage.setItem('notices', JSON.stringify(sorted));
  }
  addMouseDrag(noticeContainer, noticeSaveOrder);
  addTouchDrag(noticeContainer, noticeSaveOrder);
</script>

</body>
</html>
