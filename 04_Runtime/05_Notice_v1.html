<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공지사항</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  .notice-list { display: flex; flex-direction: column; gap: 8px; }

  .notice-item {
    background: #1c2333;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .notice-header {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .notice-left {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }

  .notice-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }

  .notice-date {
    font-size: 12px;
    opacity: 0.5;
  }

  .notice-arrow {
    font-size: 14px;
    opacity: 0.5;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .notice-item.open .notice-arrow { transform: rotate(180deg); }

  .notice-detail {
    display: none;
    padding: 0 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 12px;
  }
  .notice-item.open .notice-detail { display: block; }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 10px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 20px; }
</style>
</head>
<body>

<header>
  <h1>공지사항</h1>
</header>

<main>
  <div class="notice-list" id="noticeList"></div>
</main>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html" class="active">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
</nav>

<script>
  var NOTICES = [
    {
      id: 1,
      title: '시스템 오픈 안내',
      date: '2026-06-25',
      body: 'King Assistant OS v1.0이 오픈되었습니다.\n\n이 시스템은 조교 업무 운영을 지원하기 위한 시스템입니다.\n\n주요 기능:\n- 업무 등록 및 상태 관리\n- SOP 검색\n- FAQ 검색\n- Dooly AI 질의응답\n\n사용 중 문의사항은 담당자에게 문의해 주세요.'
    },
    {
      id: 2,
      title: '조교 업무 매뉴얼 배포',
      date: '2026-06-25',
      body: '조교 업무 매뉴얼이 배포되었습니다.\n\n매뉴얼 내용:\n- 복테 관리 방법\n- 오답노트 관리 방법\n- 비품 관리 방법\n- 복사기 사용 방법\n\n모든 조교는 매뉴얼을 숙지하고 업무에 임해 주세요.\n\n문의사항은 원장에게 직접 문의해 주세요.'
    }
  ];

  var openId = null;

  function toggle(id) {
    openId = openId === id ? null : id;
    render();
  }

  function render() {
    var container = document.getElementById('noticeList');
    container.innerHTML = NOTICES.map(function(n) {
      var isOpen = openId === n.id;
      return [
        '<div class="notice-item' + (isOpen ? ' open' : '') + '" onclick="toggle(' + n.id + ')">',
        '  <div class="notice-header">',
        '    <div class="notice-left">',
        '      <div class="notice-title">' + escHtml(n.title) + '</div>',
        '      <div class="notice-date">' + n.date + '</div>',
        '    </div>',
        '    <span class="notice-arrow">▼</span>',
        '  </div>',
        '  <div class="notice-detail">' + escHtml(n.body).replace(/\n/g, '<br>') + '</div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  render();
</script>

</body>
</html>
