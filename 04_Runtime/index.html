<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>King Assistant OS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #4da3ff;
    letter-spacing: 0.5px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    padding-bottom: 8px;
  }

  .greeting {
    font-size: 16px;
    opacity: 0.6;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* 업무 현황 카드 */
  .status-card {
    background: #1c2333;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
    display: flex;
    gap: 20px;
  }
  .status-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .status-label { font-size: 12px; opacity: 0.6; }
  .status-count { font-size: 28px; font-weight: 700; color: #4da3ff; }

  /* 업무 카드 (홈용) */
  .task-card {
    background: #1c2333;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .task-card:active { background: #263045; }

  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .task-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    flex: 1;
  }
  .task-assignee {
    font-size: 13px;
    opacity: 0.55;
  }

  /* 우선순위 신호등 */
  .signal {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .signal.urgent { color: #ff4444; }
  .signal.today  { color: #ffcc00; }
  .signal.normal { color: #3cc864; }

  /* 공지 카드 */
  .notice-card {
    background: #1c2333;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .notice-card:active { background: #263045; }
  .notice-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .notice-date  { font-size: 12px; opacity: 0.5; }

  .section-block { margin-bottom: 28px; }

  .empty-msg {
    text-align: center;
    opacity: 0.4;
    font-size: 14px;
    padding: 16px 0;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 10px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 20px; }
</style>
</head>
<body>

<header>
  <h1>King Assistant OS</h1>
</header>

<main>
  <p class="greeting">안녕하세요, 둘리(Dooly)입니다.</p>

  <p class="section-title">업무 현황</p>
  <div class="status-card">
    <div class="status-item">
      <span class="status-label">대기중</span>
      <span class="status-count" id="count-pending">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">진행중</span>
      <span class="status-count" id="count-progress">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">완료</span>
      <span class="status-count" id="count-done">0</span>
    </div>
  </div>

  <div class="section-block">
    <p class="section-title">업무</p>
    <div id="taskSection"></div>
  </div>

  <div class="section-block">
    <p class="section-title">공지</p>
    <div id="noticeSection"></div>
  </div>
</main>

<nav>
  <a href="index.html" class="active">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
</nav>

<script>
  var PRIORITY_COLOR = { urgent: '#ff4444', today: '#ffcc00', normal: '#3cc864' };

  function signal(priority) {
    var color = PRIORITY_COLOR[priority] || PRIORITY_COLOR.normal;
    return '<span class="signal ' + priority + '" style="color:' + color + '">● ' + priority + '</span>';
  }

  (function() {
    var tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

    // 업무 현황 카운트
    document.getElementById('count-pending').textContent  = tasks.filter(function(t) { return t.status === 'pending'; }).length;
    document.getElementById('count-progress').textContent = tasks.filter(function(t) { return t.status === 'in_progress'; }).length;
    document.getElementById('count-done').textContent     = tasks.filter(function(t) { return t.status === 'completed'; }).length;

    // 업무 섹션
    var taskEl = document.getElementById('taskSection');
    if (tasks.length === 0) {
      taskEl.innerHTML = '<p class="empty-msg">등록된 업무가 없습니다.</p>';
    } else {
      taskEl.innerHTML = tasks.map(function(t) {
        return [
          '<div class="task-card" onclick="location.href=\'02_Task_v1.html\'">',
          '  <div class="task-top">',
          '    <span class="task-title">' + escHtml(t.title) + '</span>',
          '    ' + signal(t.priority || 'normal'),
          '  </div>',
          '  <span class="task-assignee">담당: ' + escHtml(t.assignee) + '</span>',
          '</div>'
        ].join('');
      }).join('');
    }

    // 공지 섹션 (하드코딩)
    var notices = [
      { title: '시스템 오픈 안내', date: '2026-06-25' },
      { title: '조교 업무 매뉴얼 배포', date: '2026-06-25' }
    ];
    document.getElementById('noticeSection').innerHTML = notices.map(function(n) {
      return [
        '<div class="notice-card" onclick="location.href=\'05_Notice_v1.html\'">',
        '  <div class="notice-title">' + escHtml(n.title) + '</div>',
        '  <div class="notice-date">' + n.date + '</div>',
        '</div>'
      ].join('');
    }).join('');
  })();

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

</body>
</html>
