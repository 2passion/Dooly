<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  .search-box {
    background: #1c2333;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    margin-bottom: 12px;
  }
  .search-box::placeholder { opacity: 0.4; }

  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .filter-chip {
    background: #1c2333;
    border: 1px solid rgba(77,163,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .filter-chip.active {
    background: #4da3ff;
    border-color: #4da3ff;
    color: #0b0f1a;
    font-weight: 700;
  }

  .sop-list { display: flex; flex-direction: column; gap: 8px; }

  .sop-item {
    background: #1c2333;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .sop-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .sop-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .sop-num { color: #4da3ff; font-weight: 700; margin-right: 4px; }

  .sop-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }

  .sop-cat {
    display: inline-block;
    background: rgba(77,163,255,0.15);
    color: #4da3ff;
    border-radius: 6px;
    font-size: 11px;
    padding: 2px 8px;
    align-self: flex-start;
  }

  .sop-arrow {
    font-size: 14px;
    opacity: 0.5;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .sop-item.open .sop-arrow { transform: rotate(180deg); }

  .sop-detail {
    display: none;
    padding: 0 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 12px;
  }
  .sop-item.open .sop-detail { display: block; }

  .empty-msg {
    text-align: center;
    opacity: 0.4;
    margin-top: 48px;
    font-size: 15px;
  }

  .data-btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .btn-download { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
  .btn-upload   { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }

  .drag-handle {
    color: rgba(255,255,255,0.2);
    font-size: 18px;
    cursor: grab;
    padding-right: 10px;
    flex-shrink: 0;
    user-select: none;
  }
  .dragging {
    opacity: 0.4;
    background: #263045 !important;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }

  .path-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(77,163,255,0.12);
    border: 1px solid rgba(77,163,255,0.3);
    color: #4da3ff;
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    margin: 2px 0;
    word-break: break-all;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .path-copy-btn:active { background: rgba(77,163,255,0.25); }

  .toast-msg {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(77,163,255,0.9);
    color: #0b0f1a;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast-msg.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>SOP</h1>
</header>

<main>
  <div class="data-btn-row">
    <button class="btn-download" onclick="downloadSOPs()">📥 JSON 다운로드</button>
    <button class="btn-upload"   onclick="uploadSOPs()">📤 JSON 업로드</button>
  </div>
  <input type="text" class="search-box" id="searchInput" placeholder="SOP 검색..." oninput="render()">
  <div class="filter-row" id="filterRow"></div>
  <div class="sop-list" id="sopList"></div>
</main>

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>

    <span>SOP</span>

  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>

    <span>설정</span>

</nav>

<script>
  var SOPS = [

    // ===== 복테 =====
    {
      id: 1, title: '복테 제출함 관리 SOP', category: '복테',
      body: '1. 학생 하원 즉시 제출함을 비운다.\n2. 내용물: 오답기록표 + 복습테스트(복테).\n3. 오답기록표: 챙겨서 다음 등원용 복테 제작에 활용.\n4. 복테(완료): 점수 기록 후 스캔하여 학생 폴더에 저장.\n5. 복테(미완료): 복테 보관함으로 이동.\n6. 원칙: "학생이 하원하면 제출함은 반드시 비운다."'
    },
    {
      id: 2, title: '복테 제작 SOP', category: '복테',
      body: '1. 학생이 제출한 오답기록표를 확인한다.\n2. 오답기록표의 날짜/페이지/문제번호를 바탕으로 복테를 제작한다.\n3. 제작 완료 후 PC 저장 → 프린트 → 복테 보관함에 보관.\n4. 퇴근 30분 전: 학생별 복테 프린트 → PC 저장 → 작업완료 폴더 저장.\n5. 복테는 다음 등원 시 학생에게 즉시 제공 가능해야 한다.'
    },
    {
      id: 3, title: '복테 보관함 운영 SOP', category: '복테',
      body: '1. 보관함 배치 규칙:\n   - X존(고등): 고3 → 고2 → 고1 (위에서 아래)\n   - Y존(초·중): 초등 전체 → 중3 → 중2 → 중1 (위에서 아래)\n2. 학년 칸 내 A반/B반 섹션파일로 구분:\n   - 앞부분: 복습테스트, 프린트물\n   - 뒷부분: 오답기록표\n3. 자료 찾기: 학년(X/Y존) → 반(A/B) 순서로 확인.\n4. 정리 시 앞/뒷부분 위치를 반드시 구분한다.'
    },
    {
      id: 4, title: '복테 처리 및 폐기 SOP', category: '복테',
      body: '1. 완료된 복테: 스캔 후 학생 폴더에 저장.\n2. 스캔 완료된 문제지: 분리수거(폐기).\n3. 빠른 정답지(뒷면 백지): 이면지 보관함으로 이동.\n4. 미완료 복테: 복테 보관함에 보관 (다음 등원 시 재사용).\n5. 완료 기준: 모든 별표(★) 문제가 큰 세모(△)로 해결된 상태.'
    },

    // ===== 오답노트 =====
    {
      id: 5, title: '오답기록표 관리 SOP', category: '오답노트',
      body: '1. 학생은 등원 시 오답기록표를 찾아 오늘 틀린 문제를 기록한다.\n2. 기록 항목: 날짜, 페이지, 문제 번호 (세로로 기록).\n3. 질문 필요 문제: 문제 번호 뒤에 별표(★) 표시.\n4. 하원 시 반드시 학원에 제출 (개별 소지 금지).\n5. 오답기록표에 "끝" 기재 시: 교재 전체 오답을 모아 제본 → 첫 페이지에 "만든날짜 + 오답노트" 기입 후 학생에게 전달.'
    },
    {
      id: 6, title: '오답노트 제본 SOP', category: '오답노트',
      body: '1. 오답기록표에 "끝"이 기재된 경우 오답노트 제본을 진행한다.\n2. 교재 전체 오답기록표를 수집한다.\n3. 제본 링 사이즈: 20mm (양이 많은 자료 기준).\n4. 제본 방법: 한 번에 최대 20장씩 펀칭, 좌측 끝에 붙여서 삽입.\n5. 첫 페이지에 "만든날짜 + 오답노트" 기입.\n6. 완성된 오답노트를 학생에게 전달한다.\n7. 작업 후 제본기 찌꺼기함을 반드시 비운다.'
    },

    // ===== 비품 =====
    {
      id: 7, title: '연습장 관리 SOP', category: '비품',
      body: '1. 연습장 보관함은 항상 5권을 유지한다 (50매 양식 사용).\n2. 오답기록표 정리 시 보관함을 확인한다.\n3. 5권 미만이면 즉시 제작하여 채워 넣는다.\n4. 제본 링 사이즈: 12mm (연습장/내신모의 등 양이 적은 자료).\n5. 연습장이 없는 학생은 이면지 보관함에서 이면지를 꺼내 사용한다.'
    },
    {
      id: 8, title: '이면지 보관함 SOP', category: '비품',
      body: '1. 위치: 복테 제출함 아래.\n2. 수거 대상: 스캔/프린트 후 발생한 깨끗한 이면지.\n3. 조교 업무: 작업 후 이면지는 즉시 폐기 말고 보관함에 정리.\n4. 학생 활용: 연습장 미지참 학생이 자유롭게 꺼내 사용.\n5. 수시로 정리하여 항상 사용 가능한 상태를 유지한다.'
    },
    {
      id: 9, title: '소모품 재고 관리 SOP', category: '비품',
      body: '1. 관리 대상: A4 용지(복사기 근처), 제본 링(제본기 근처).\n2. 보고 시점: 재고 20~30% 남았을 때 미리 원장에게 보고.\n3. 보고 내용: "현재 A4 용지(또는 제본 링)가 며칠 내로 소진될 것 같습니다. 추가 준비가 필요합니다."\n4. 재고 소진 후 보고는 금지 (업무 공백 초래).\n5. 제본 링 사이즈 기준:\n   - 12mm: 연습장, 내신모의 10회분 등 얇은 자료\n   - 20mm: 오답노트, 기출 20개 학교 등 두꺼운 자료'
    },

    // ===== 장비 =====
    {
      id: 10, title: '복사기/스캔 SOP', category: '장비',
      body: '1. 스캔 방법:\n   - ADF(자동): 많은 양의 깨끗한 종이 스캔 시 사용.\n   - 수동(평판): 종이가 얇거나 구겨진 경우 반드시 수동 스캔.\n2. 복사 설정 원칙: 양면 출력(양면→양면)이 기본.\n3. 복사 설정 옵션:\n   - 단면→단면: 보조\n   - 단면→양면: 보조\n   - 양면→단면: 보조\n   - 양면→양면: 주로 사용(원칙)\n4. 구겨진 종이는 반드시 수동 스캔.\n5. 종이 걸릴 것 같으면 무리하게 ADF에 넣지 않는다.'
    },
    {
      id: 11, title: '제본기 사용 SOP', category: '장비',
      body: '1. 펀칭 단위: 한 번에 최대 20장씩 나누어 펀칭.\n2. 정렬 방법: 종이를 좌측 끝에 완전히 붙여서 삽입.\n3. 링 사이즈:\n   - 12mm: 연습장, 내신모의 10회분 등 얇은 자료\n   - 20mm: 오답노트, 기출 20개 학교 등 두꺼운 자료\n4. 작업 후 반드시 하단 찌꺼기함(폐지통)을 비운다.\n5. 찌꺼기함 미비우면 기기 고장 원인이 된다.'
    },

    // ===== 루틴 =====
    {
      id: 12, title: '출근 루틴 SOP', category: '루틴',
      body: '1. 복테 제출함 확인.\n2. "조교할일(이니셜)" 확인 및 업무 시작.\n3. 이해 안 되는 업무는 즉시 원장에게 질문.\n4. 연습장 보관함 확인 (5권 유지).\n5. 이면지 보관함 정리.\n6. 필기구 배치 기준 확인.'
    },
    {
      id: 13, title: '퇴근 루틴 SOP', category: '루틴',
      body: '1. 퇴근 30분 전:\n   - 학생별 복테 프린트\n   - PC 저장\n   - 작업완료 폴더 저장\n   - 바탕화면 날짜 폴더 자료를 학생별 폴더에 저장\n2. 퇴근 직전:\n   - 주변 정리: 책상 위 → 의자 위 → 바닥 순서\n   - 필기구 원위치\n   - PC 및 모니터 전원 끄기'
    },

    // ===== 채점 =====
    {
      id: 14, title: '채점 규칙 SOP', category: '채점',
      body: '■ 채점 기호\n- O : 정답\n- / (슬래시) : 오답 1차\n- △ (세모) : 스스로 고쳐서 맞춤\n- ☆ (별표) : 질문이 필요한 문제\n- ☆ 위에 큰 △ : 질문 후 해결 완료 (3차 채점)\n\n■ 숙제 채점 (학생 스스로)\n1. 1차 채점(O, /): 정답 보고 채점\n2. 2차 채점(△, ☆): 스스로 고친 후 다시 채점\n3. 3차 채점: 해설지 참고 + 질문 후 해결 → ☆ 위에 큰 △\n\n■ 테스트 채점 (조교가 진행)\n1. 학생 제출 → 1차 채점(O, /)\n2. 학생 스스로 고침 → 2차 채점(△, ☆)\n3. 학생 해설지+질문 후 해결 → 3차 채점 (☆ 위에 큰 △)\n\n■ 주의사항\n- 채점 후 틀린이유를 "오답유형 분류표" 참고하여 작성하도록 안내\n- 틀린이유 미기재 시: 첫 페이지 위쪽에 빨간펜으로 "틀린이유 쓰세요" 기재'
    },
    {
      id: 15, title: '교재검사 SOP', category: '채점',

    },
    {
      id: 22, title: '학생 자료 분실/누락 SOP', category: '예외상황',

    {
      id: 23, title: '인터넷/프린터 오류 SOP', category: '예외상황',
      body: '■ 프린터 오류 발생 시\n1. 프린터 오류 메시지 확인\n2. 용지 걸림 → 복사기 종이 걸림 SOP 참고\n3. 단독 해결 불가 시 → 원장에게 즉시 보고\n4. 긴급 시 다른 기기 또는 수동 처리 방법 원장에게 문의\n\n■ 공유폴더 접근 불가 시\n1. 네트워크 연결 상태 확인\n2. PC 재시작 시도\n3. 해결 불가 시 → 원장에게 보고\n\n■ 원칙\n- 혼자 판단하여 시스템을 임의로 조작하지 않는다\n- 원장에게 즉시 보고하고 지시를 받는다'

  ];

  var SOPS_DEFAULT = SOPS.slice();
  var stored = localStorage.getItem('sops');
  if (stored) { try { SOPS = JSON.parse(stored); } catch(e) {} }

  var CATEGORIES = ['전체', '복테', '오답노트', '채점', '비품', '장비', '루틴', '학생관리', '예외상황'];
  var activeCategory = '전체';
  var openId = null;

  function initFilters() {
    var row = document.getElementById('filterRow');
    row.innerHTML = CATEGORIES.map(function(c) {
      return '<button class="filter-chip' + (c === activeCategory ? ' active' : '') +
             '" onclick="setCategory(\'' + c + '\')">' + c + '</button>';
    }).join('');
  }

  function setCategory(cat) {
    activeCategory = cat;
    openId = null;
    initFilters();
    render();
  }

  function toggle(id) {
    openId = openId === id ? null : id;
    render();
  }

  function render() {
    var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    var filtered = SOPS.filter(function(s) {
      var matchCat = activeCategory === '전체' || s.category === activeCategory;
      var matchKey = !keyword || s.title.toLowerCase().includes(keyword) || s.category.toLowerCase().includes(keyword);
      return matchCat && matchKey;
    });

    var container = document.getElementById('sopList');
    if (filtered.length === 0) {
      container.innerHTML = '<p class="empty-msg">검색 결과가 없습니다.</p>';
      return;
    }

    container.innerHTML = filtered.map(function(s, index) {
      var isOpen = openId === s.id;
      return [
        '<div class="sop-item' + (isOpen ? ' open' : '') + '" draggable="true" data-id="' + String(s.id) + '" onclick="toggle(' + s.id + ')">',
        '  <div class="sop-header">',
        '    <span class="drag-handle" onclick="event.stopPropagation()">&#10783;</span>',
        '    <div class="sop-left">',
        '      <div class="sop-title"><span class="sop-num">' + (index + 1) + '.</span>' + escHtml(s.title) + '</div>',
        '      <span class="sop-cat">' + escHtml(s.category) + '</span>',
        '    </div>',
        '    <span class="sop-arrow">▼</span>',
        '  </div>',
        '  <div class="sop-detail">' + linkify(escHtml(s.body).replace(/\n/g, '<br>')) + '</div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function getToday() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function downloadSOPs() {
    downloadJSON(SOPS, 'sop_' + getToday() + '.json');
  }

  function uploadSOPs() {
    uploadJSON(function(data) {
      SOPS = data;
      localStorage.setItem('sops', JSON.stringify(data));
      activeCategory = '전체'; openId = null;
      initFilters(); render();
    });
  }

  function downloadJSON(data, filename) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function uploadJSON(callback) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try { callback(JSON.parse(ev.target.result)); }
        catch(err) { alert('JSON 형식이 올바르지 않습니다.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function linkify(str) {
    str = str.replace(/(https?:\/\/[^\s<>"]+)/g, function(url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#4da3ff;text-decoration:underline;">' + url + '</a>';
    });
    str = str.replace(/((?:C:\\|D:\\|E:\\|\\\\)[^\s<>"]+)/g, function(path) {
      var escaped = path.replace(/'/g, "\\'");
      return '<button class="path-copy-btn" onclick="copyPath(\'' + escaped + '\')">📋 ' + path + '</button>';
    });
    return str;
  }

  function copyPath(path) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(path).then(function() { showToast(); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = path;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    }
  }

  function showToast() {
    var t = document.getElementById('toastMsg');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function addMouseDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('dragstart', function(e) {
      dragEl = e.target.closest('[data-id]');
      if (dragEl) setTimeout(function() { dragEl.classList.add('dragging'); }, 0);
    });
    container.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragEl) return;
      var after = getDragAfterElement(container, e.clientY);
      if (after == null) container.appendChild(dragEl);
      else container.insertBefore(dragEl, after);
    });
    container.addEventListener('dragend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  function getDragAfterElement(container, y) {
    var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
    return items.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function addTouchDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('touchstart', function(e) {
      var handle = e.target.closest('.drag-handle');
      if (!handle) return;
      dragEl = handle.closest('[data-id]');
      if (dragEl) dragEl.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
    container.addEventListener('touchmove', function(e) {
      if (!dragEl) return;
      e.preventDefault();
      var y = e.touches[0].clientY;
      var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
      var after = items.find(function(item) {
        var rect = item.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      });
      if (after) container.insertBefore(dragEl, after);
      else container.appendChild(dragEl);
    }, { passive: false });
    container.addEventListener('touchend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  initFilters();
  render();

  var sopContainer = document.getElementById('sopList');
  function sopSaveOrder(newOrder) {
    var allSops = JSON.parse(localStorage.getItem('sops') || 'null') || SOPS;
    var sorted = newOrder.map(function(id) {
      return allSops.find(function(s) { return String(s.id) === id; });
    }).filter(Boolean);
    SOPS = sorted;
    localStorage.setItem('sops', JSON.stringify(sorted));
  }
  addMouseDrag(sopContainer, sopSaveOrder);
  addTouchDrag(sopContainer, sopSaveOrder);
</script>
