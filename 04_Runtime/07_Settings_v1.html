<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>설정 — KING Assistant OS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; color: #ffffff; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    padding-bottom: 8px;
  }

  .settings-section { margin-bottom: 28px; }
  .settings-title {
    font-size: 13px;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .settings-card { background: #1c2333; border-radius: 12px; padding: 16px; }

  /* 담당자 목록 */
  .assignee-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    flex-direction: column;
    gap: 0;
  }
  .assignee-item:last-child { border-bottom: none; }
  .assignee-name { font-size: 15px; }
  .assignee-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 0;
  }
  .assignee-item-body {
    display: none;
    padding: 8px 0 12px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    width: 100%;
  }
  .assignee-item.open .assignee-item-body { display: block; }
  .edit-name-input {
    width: 100%;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    margin-bottom: 8px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }
  .edit-memo-input {
    width: 100%;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    resize: none;
    height: 100px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .edit-action-row { display: flex; gap: 8px; }
  .btn-save-assignee {
    flex: 1;
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    padding: 8px;
    cursor: pointer;
    min-height: 36px;
  }
  .btn-delete-assignee {
    background: rgba(255,80,80,0.12);
    border: 1px solid rgba(255,80,80,0.25);
    color: #ff5050;
    border-radius: 8px;
    font-size: 13px;
    padding: 8px 16px;
    cursor: pointer;
    min-height: 36px;
  }

  .add-row { display: flex; gap: 10px; margin-top: 14px; }
  .add-input {
    flex: 1;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
    min-height: 48px;
    font-family: Arial, sans-serif;
  }
  .add-input:focus { border-color: #4da3ff; }
  .add-btn-sm {
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 0 18px;
    min-height: 48px;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .empty-msg { text-align: center; opacity: 0.4; font-size: 14px; padding: 16px 0; }

  /* DB 폴더 경로 섹션 */
  .settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .settings-label { font-size: 14px; opacity: 0.7; }
  .settings-value { font-size: 14px; color: #4da3ff; }
  .settings-notice {
    font-size: 13px;
    line-height: 1.8;
    opacity: 0.7;
    background: rgba(255,200,50,0.07);
    border: 1px solid rgba(255,200,50,0.2);
    border-radius: 8px;
    padding: 12px;
    margin-top: 4px;
  }

  /* 데이터 초기화 */
  .reset-btn {
    width: 100%;
    background: rgba(255,80,80,0.12);
    border: 1px solid rgba(255,80,80,0.3);
    color: #ff5050;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    min-height: 52px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .reset-btn:active { background: rgba(255,80,80,0.22); }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }
</style>
</head>
<body>

<header>
  <h1>설정</h1>
</header>

<main>

  <!-- 담당자 관리 -->
  <div class="settings-section">
    <p class="settings-title">담당자 관리</p>
    <div class="settings-card">
      <div id="assigneeList"></div>
      <div class="add-row">
        <input type="text" id="inputAssigneeName" class="add-input" placeholder="담당자 이름 입력" maxlength="20">
        <button class="add-btn-sm" onclick="addAssignee()">추가</button>
      </div>
    </div>
  </div>

  <!-- DB 폴더 경로 -->
  <div class="settings-section">
    <p class="settings-title">DB 폴더 경로</p>
    <div class="settings-card">
      <div class="settings-row">
        <span class="settings-label">현재 저장 위치</span>
        <span class="settings-value">기본 다운로드 폴더</span>
      </div>
      <div class="settings-notice">
        ⚠️ 현재 HTML 버전에서는 브라우저 보안 정책으로<br>
        폴더 경로를 직접 지정할 수 없습니다.<br><br>
        📌 PWA 전환 후 폴더 직접 지정 기능이 추가됩니다.<br>
        JSON 파일은 브라우저 기본 다운로드 폴더에 저장됩니다.<br>
        업로드 시 마지막으로 열었던 폴더가 자동으로 열립니다.
      </div>
    </div>
  </div>

  <!-- 데이터 초기화 -->
  <div class="settings-section">
    <p class="settings-title">데이터 초기화</p>
    <div class="settings-card">
      <button class="reset-btn" onclick="resetAllData()">⚠️ 전체 데이터 초기화</button>
    </div>
  </div>

</main>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
  <a href="07_Settings_v1.html" class="active">
    <span class="nav-icon">⚙️</span>
    <span>설정</span>
  </a>
</nav>

<script>
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function loadAssignees() {
    var raw = JSON.parse(localStorage.getItem('assignees') || '[]');
    return raw.map(function(a) {
      if (typeof a === 'string') return { name: a, memo: '' };
      return a;
    });
  }
  function saveAssignees(list) { localStorage.setItem('assignees', JSON.stringify(list)); }

  function addAssignee() {
    var name = document.getElementById('inputAssigneeName').value.trim();
    if (!name) { alert('이름을 입력해 주세요.'); return; }
    var list = loadAssignees();
    if (list.some(function(a) { return a.name === name; })) {
      alert('이미 등록된 담당자입니다.'); return;
    }
    list.push({ name: name, memo: '' });
    saveAssignees(list);
    document.getElementById('inputAssigneeName').value = '';
    renderAssignees();
  }

  function toggleAssigneeEdit(index) {
    var item = document.getElementById('aitem_' + index);
    if (item) item.classList.toggle('open');
  }

  function saveAssigneeEdit(index) {
    var name = document.getElementById('editName_' + index).value.trim();
    var memo = document.getElementById('editMemo_' + index).value;
    if (!name) { alert('이름을 입력해 주세요.'); return; }
    var list = loadAssignees();
    if (index >= 0 && index < list.length) {
      list[index].name = name;
      list[index].memo = memo;
      saveAssignees(list);
      renderAssignees();
    }
  }

  function deleteAssignee(index) {
    var list = loadAssignees();
    if (!confirm(list[index].name + '을(를) 삭제하시겠습니까?')) return;
    list.splice(index, 1);
    saveAssignees(list);
    renderAssignees();
  }

  function renderAssignees() {
    var list = loadAssignees();
    var el = document.getElementById('assigneeList');
    if (list.length === 0) {
      el.innerHTML = '<p class="empty-msg">등록된 담당자가 없습니다.</p>';
      return;
    }
    el.innerHTML = list.map(function(a, i) {
      return [
        '<div class="assignee-item" id="aitem_' + i + '">',
        '  <div class="assignee-item-header" onclick="toggleAssigneeEdit(' + i + ')">',
        '    <span class="assignee-name">' + escHtml(a.name) + '</span>',
        '    <span style="font-size:12px;opacity:0.4;">✏️ 클릭하여 수정</span>',
        '  </div>',
        '  <div class="assignee-item-body">',
        '    <input type="text" class="edit-name-input" id="editName_' + i + '" value="' + escAttr(a.name) + '" placeholder="이름 변경" onclick="event.stopPropagation()">',
        '    <textarea class="edit-memo-input" id="editMemo_' + i + '" placeholder="메모 (5줄)" onclick="event.stopPropagation()">' + escHtml(a.memo || '') + '</textarea>',
        '    <div class="edit-action-row">',
        '      <button class="btn-save-assignee" onclick="event.stopPropagation();saveAssigneeEdit(' + i + ')">저장</button>',
        '      <button class="btn-delete-assignee" onclick="event.stopPropagation();deleteAssignee(' + i + ')">삭제</button>',
        '    </div>',
        '  </div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function resetAllData() {
    if (!confirm('모든 데이터(업무, SOP, FAQ, 공지, 담당자)를 초기화하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.')) return;
    ['tasks','sops','faqs','notices','assignees'].forEach(function(k) {
      localStorage.removeItem(k);
    });
    alert('초기화 완료되었습니다.');
    renderAssignees();
  }

  /* Enter 키로 담당자 추가 */
  document.getElementById('inputAssigneeName').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addAssignee();
  });

  renderAssignees();
</script>

</body>
</html>
