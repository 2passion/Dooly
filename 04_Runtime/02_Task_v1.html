<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>업무 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  .add-btn {
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  /* 업무 추가 폼 */
  .form-panel {
    background: #1c2333;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .form-panel.visible { display: block; }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 8px;
    color: #ffffff;
    font-size: 15px;
    padding: 10px 12px;
    min-height: 44px;
    outline: none;
    -webkit-appearance: none;
  }
  .form-group select option { background: #0b0f1a; }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .btn-save {
    flex: 1;
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    min-height: 48px;
    cursor: pointer;
  }
  .btn-cancel {
    flex: 1;
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    font-size: 15px;
    min-height: 48px;
    cursor: pointer;
  }

  /* 업무 카드 */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-card {
    background: #1c2333;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .task-card:active { background: #263045; }

  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .task-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    flex: 1;
  }

  /* 우선순위 신호등 */
  .signal {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .task-footer {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task-assignee {
    font-size: 13px;
    opacity: 0.6;
    flex: 1;
  }

  .badge {
    display: inline-block;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
  }
  .badge-pending     { background: rgba(150,150,150,0.25); color: #aaa; }
  .badge-in_progress { background: rgba(77,163,255,0.25);  color: #4da3ff; }
  .badge-completed   { background: rgba(60,200,100,0.25);  color: #3cc864; }

  .delete-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.4);
    border-radius: 6px;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .empty-msg {
    text-align: center;
    opacity: 0.4;
    margin-top: 48px;
    font-size: 15px;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 10px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 20px; }
</style>
</head>
<body>

<header>
  <h1>업무 관리</h1>
  <button class="add-btn" onclick="toggleForm()">+ 업무 추가</button>
</header>

<main>
  <div class="form-panel" id="formPanel">
    <div class="form-group">
      <label>업무 제목</label>
      <input type="text" id="inputTitle" placeholder="업무 제목 입력">
    </div>
    <div class="form-group">
      <label>담당자</label>
      <input type="text" id="inputAssignee" placeholder="담당자 이름">
    </div>
    <div class="form-group">
      <label>우선순위</label>
      <select id="inputPriority">
        <option value="normal">normal</option>
        <option value="today">today</option>
        <option value="urgent">urgent</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-save" onclick="saveTask()">저장</button>
      <button class="btn-cancel" onclick="toggleForm()">취소</button>
    </div>
  </div>

  <div class="task-list" id="taskList"></div>
</main>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html" class="active">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
</nav>

<script>
  var STATUS_CYCLE = ['pending', 'in_progress', 'completed'];
  var STATUS_LABEL = { pending: '대기', in_progress: '진행중', completed: '완료' };
  var PRIORITY_COLOR = { urgent: '#ff4444', today: '#ffcc00', normal: '#3cc864' };

  function signal(priority) {
    var p = priority || 'normal';
    var color = PRIORITY_COLOR[p] || PRIORITY_COLOR.normal;
    return '<span class="signal" style="color:' + color + '">● ' + p + '</span>';
  }

  function loadTasks() {
    return JSON.parse(localStorage.getItem('tasks') || '[]');
  }

  function saveTasks(tasks) {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function genId() {
    return 'T' + Date.now();
  }

  function toggleForm() {
    var panel = document.getElementById('formPanel');
    panel.classList.toggle('visible');
    if (panel.classList.contains('visible')) {
      document.getElementById('inputTitle').focus();
    }
  }

  function saveTask() {
    var title    = document.getElementById('inputTitle').value.trim();
    var assignee = document.getElementById('inputAssignee').value.trim();
    var priority = document.getElementById('inputPriority').value;

    if (!title) { alert('업무 제목을 입력하세요.'); return; }

    var tasks = loadTasks();
    tasks.unshift({
      id: genId(),
      title: title,
      assignee: assignee || '미지정',
      status: 'pending',
      priority: priority,
      created_at: new Date().toISOString().slice(0, 10)
    });
    saveTasks(tasks);

    document.getElementById('inputTitle').value = '';
    document.getElementById('inputAssignee').value = '';
    document.getElementById('inputPriority').value = 'normal';
    document.getElementById('formPanel').classList.remove('visible');

    renderTasks();
  }

  function cycleStatus(id) {
    var tasks = loadTasks().map(function(t) {
      if (t.id === id) {
        var idx = STATUS_CYCLE.indexOf(t.status);
        t.status = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
      }
      return t;
    });
    saveTasks(tasks);
    renderTasks();
  }

  function deleteTask(id, e) {
    e.stopPropagation();
    if (!confirm('이 업무를 삭제하시겠습니까?')) return;
    saveTasks(loadTasks().filter(function(t) { return t.id !== id; }));
    renderTasks();
  }

  function renderTasks() {
    var tasks = loadTasks();
    var container = document.getElementById('taskList');

    if (tasks.length === 0) {
      container.innerHTML = '<p class="empty-msg">등록된 업무가 없습니다.</p>';
      return;
    }

    container.innerHTML = tasks.map(function(t) {
      var label = STATUS_LABEL[t.status] || t.status;
      return [
        '<div class="task-card" onclick="cycleStatus(\'' + t.id + '\')">',
        '  <div class="task-top">',
        '    <span class="task-title">' + escHtml(t.title) + '</span>',
        '    ' + signal(t.priority),
        '  </div>',
        '  <div class="task-footer">',
        '    <span class="task-assignee">담당: ' + escHtml(t.assignee) + '</span>',
        '    <span class="badge badge-' + t.status + '">' + label + '</span>',
        '    <button class="delete-btn" onclick="deleteTask(\'' + t.id + '\', event)">삭제</button>',
        '  </div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  renderTasks();
</script>

</body>
</html>
