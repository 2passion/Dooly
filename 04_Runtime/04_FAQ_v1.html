<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAQ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  .search-box {
    background: #1c2333;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    margin-bottom: 12px;
  }
  .search-box::placeholder { opacity: 0.4; }

  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .filter-chip {
    background: #1c2333;
    border: 1px solid rgba(77,163,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .filter-chip.active {
    background: #4da3ff;
    border-color: #4da3ff;
    color: #0b0f1a;
    font-weight: 700;
  }

  .faq-list { display: flex; flex-direction: column; gap: 8px; }

  .faq-item {
    background: #1c2333;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .faq-question {
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .faq-q-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .faq-num { color: #4da3ff; font-weight: 700; margin-right: 4px; }

  .faq-q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
  }

  .faq-cat {
    display: inline-block;
    background: rgba(77,163,255,0.15);
    color: #4da3ff;
    border-radius: 6px;
    font-size: 11px;
    padding: 2px 8px;
    align-self: flex-start;
  }

  .faq-arrow {
    font-size: 14px;
    opacity: 0.5;
    flex-shrink: 0;
    margin-top: 2px;
    transition: transform 0.2s;
  }
  .faq-item.open .faq-arrow { transform: rotate(180deg); }

  .faq-answer {
    display: none;
    padding: 0 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 12px;
  }
  .faq-answer::before {
    content: 'A. ';
    color: #4da3ff;
    font-weight: 700;
  }
  .faq-item.open .faq-answer { display: block; }

  .empty-msg {
    text-align: center;
    opacity: 0.4;
    margin-top: 48px;
    font-size: 15px;
  }

  .data-btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .btn-download { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
  .btn-upload   { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }

  .drag-handle {
    color: rgba(255,255,255,0.2);
    font-size: 18px;
    cursor: grab;
    padding-right: 10px;
    flex-shrink: 0;
    user-select: none;
  }
  .dragging {
    opacity: 0.4;
    background: #263045 !important;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }

  .path-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(77,163,255,0.12);
    border: 1px solid rgba(77,163,255,0.3);
    color: #4da3ff;
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    margin: 2px 0;
    word-break: break-all;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .path-copy-btn:active { background: rgba(77,163,255,0.25); }

  .toast-msg {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(77,163,255,0.9);
    color: #0b0f1a;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast-msg.show { opacity: 1; }
</style>
</head>
<body>

  <h1>FAQ</h1>

<main>
  <div class="data-btn-row">

  </div>
  <input type="text" class="search-box" id="searchInput" placeholder="FAQ 검색..." oninput="render()">
  <div class="filter-row" id="filterRow"></div>
  <div class="faq-list" id="faqList"></div>
</main>

<script>
  var FAQS = [
    { id: 1,  category: '복사기',  question: '복사기가 종이를 먹었어요',           answer: '종이가 구겨진 경우 ADF를 사용하지 말고 수동(평판) 스캔으로 진행하세요. 무리하게 ADF에 넣으면 용지 걸림이 발생합니다. 복사기/스캔 SOP를 확인하세요.' },
    { id: 2,  category: '복테',    question: '학생이 복테를 못 찾겠어요',           answer: '복테 보관함 배치 순서를 확인하세요. X존(고등): 고3→고2→고1, Y존(초중): 초등→중3→중2→중1 순서입니다. 학년 내 A반/B반 섹션파일 앞부분을 확인하세요. 복테 보관함 운영 SOP를 참고하세요.' },
    { id: 3,  category: '오답노트', question: '오답기록표에 끝이라고 적혀있어요',    answer: '오답노트 제본을 진행해야 합니다. 교재 전체 오답기록표를 수집하고, 20mm 링으로 제본 후 첫 페이지에 "만든날짜 + 오답노트"를 기입하여 학생에게 전달하세요. 오답노트 제본 SOP를 참고하세요.' },
    { id: 4,  category: '비품',    question: '연습장이 부족해요',                   answer: '연습장 보관함은 항상 5권을 유지해야 합니다. 5권 미만이면 즉시 제작하세요 (50매 양식, 12mm 링 사용). 연습장이 없는 학생은 이면지 보관함에서 이면지를 사용하도록 안내하세요.' },
    { id: 5,  category: '복사기',  question: 'ADF 스캔과 수동 스캔 차이가 뭐예요?', answer: 'ADF(자동 원고 급지)는 깨끗하고 많은 양의 종이를 한 번에 스캔할 때 사용합니다. 수동(평판) 스캔은 종이가 얇거나 구겨진 경우에 사용합니다. 구겨진 종이를 ADF에 넣으면 용지 걸림이 발생하므로 반드시 수동으로 진행하세요.' },
    { id: 6,  category: '제본기',  question: '제본링 사이즈는 어떻게 선택해요?',    answer: '12mm 링: 연습장, 내신모의 10회분 등 얇은 자료에 사용합니다. 20mm 링: 오답노트, 기출 20개 학교 등 두꺼운 자료에 사용합니다. 소모품 재고 관리 SOP를 참고하세요.' },
    { id: 7,  category: '제본기',  question: '제본기 찌꺼기는 언제 비워요?',         answer: '제본기 사용 후 매번 반드시 하단 찌꺼기함(폐지통)을 비워야 합니다. 찌꺼기를 비우지 않으면 기기 고장의 원인이 됩니다. 제본기 사용 SOP를 참고하세요.' },
    { id: 8,  category: '복테',    question: '복테 보관함 배치 순서가 어떻게 돼요?', answer: 'X존(고등): 위에서부터 고3→고2→고1 순서입니다. Y존(초·중): 위에서부터 초등 전체→중3→중2→중1 순서입니다. 학년 칸 안에는 A반/B반 섹션파일이 있으며, 앞부분에 복테/프린트물, 뒷부분에 오답기록표를 보관합니다.' },
    { id: 9,  category: '비품',    question: '비품이 부족할 때 언제 보고해요?',      answer: '재고가 20~30% 남았을 때 미리 원장에게 보고해야 합니다. 재고가 완전히 소진된 후 보고하면 업무 공백이 발생합니다. "A4 용지(또는 제본 링)가 며칠 내로 소진될 것 같습니다. 추가 준비가 필요합니다."라고 구체적으로 알리세요.' },
    { id: 10, category: '비품',    question: '이면지는 어디에 보관해요?',            answer: '이면지 보관함은 복테 제출함 아래에 있습니다. 스캔/프린트 후 발생한 뒷면이 깨끗한 종이를 이면지 보관함에 정리하세요. 연습장을 미지참한 학생이 자유롭게 꺼내 쓸 수 있도록 항상 정돈된 상태를 유지하세요.' },
    { id: 11, category: '복테',    question: '복테 완료 기준이 뭐예요?',             answer: '모든 별표(★) 문제가 큰 세모(△)로 해결된 상태가 완료입니다. 완료된 복테는 점수 칸에 세모 표시 후 스캔하여 학생 폴더에 저장합니다. 미완료 복테는 복테 보관함에 넣어 다음 시간에 다시 풀도록 합니다.' },
    { id: 12, category: '비품',    question: '연습장은 몇 권 유지해야 해요?',        answer: '연습장 보관함은 항상 5권을 유지해야 합니다 (50매 양식 사용). 오답기록표 정리 시마다 보관함을 확인하고, 5권 미만이면 즉시 제작하여 채워 넣습니다.' },
    { id: 13, category: '복테',      question: '복테랑 오답노트가 뭐가 달라요?',           answer: '복테(복습테스트)는 오답기록표를 바탕으로 매일 제공하는 일일 복습 테스트입니다. 오답노트는 교재 전체가 끝났을 때 복테 전체를 모아 제본한 누적 복습 자료입니다. 복테는 매일, 오답노트는 교재 종료 시 제작합니다.' },
    { id: 14, category: '채점',      question: '채점 기호(O, /, △, ☆)는 어떻게 써요?',   answer: 'O: 정답. /（슬래시）: 오답 1차. △（세모）: 스스로 고쳐서 맞춤. ☆（별표）: 질문이 필요한 문제. ☆ 위에 큰 △: 질문 후 해결 완료(3차 채점). 숙제는 학생이 스스로 채점하고, 테스트는 조교가 채점합니다.' },
    { id: 15, category: '채점',      question: '진단평가 커트라인이 어떻게 되나요?',       answer: '1차 커트라인(70점 이상): 진단평가 오답만 연습장에 풀고 제출. 2차 커트라인(50~69점): 오답노트 다시 한 번 풀고 제출. 2차 미통과(50점 미만): 틀린문제 관련 과제를 별도로 받아서 풀고 제출합니다. 진단평가 결과는 시험지와 함께 학부모에게 전달됩니다.' },
    { id: 16, category: '채점',      question: '교재검사는 어떻게 해요?',                 answer: '개념편과 유형편을 교대로 검사합니다. 예를 들어 개념편을 풀고 있으면 유형편을 검사합니다. 덜 완료된 페이지 번호만 목차에 기록하고(문제번호 X), 추가 검사 후 완료된 페이지에 슬래시(/) 표시, 전체 완료 시 "OK"를 기재합니다. 모르면 학생 또는 원장에게 확인하세요.' },
    { id: 17, category: '오답노트',   question: '오답노트 폴더명은 어떻게 만들어요?',       answer: '날짜 + 오답노트 + 교재 + 학생이름 순서로 만듭니다. 예) 260402 오답노트 중1-1 쎈 김철수. 오답기록표에 "끝"이라고 적혀있으면 오답노트 제작을 시작합니다. 첫 페이지 상단에 "오답노트"와 만든 날짜를 기입합니다.' },
    { id: 18, category: '파일관리',   question: '파일명 규칙이 어떻게 되나요?',             answer: 'hwp 파일: 날짜+복테+학년+교재+학생이름. WANT 프로그램: 날짜+교재+학생이름(복테 미포함). 스캔 파일: 오답노트_날짜 학년 교재 학생이름. 같은 복테 추가 시 끝에 -1, -2 번호 추가. 파일명 규칙 SOP를 참고하세요.' },
    { id: 19, category: '파일관리',   question: '2022 교재와 22개정 교재 차이가 뭐예요?',   answer: '2022는 출판사에서 출판한 연도(2022년)이고, 22개정은 교육부가 교육과정을 개정한 연도(2022년)입니다. 교육부가 22개정을 하면 출판사는 3~4년 후(2025~2026년)에 출판합니다. 같은 교재명이라도 학생마다 다를 수 있으니 복테 제작 시 반드시 확인하세요.' },
    { id: 20, category: '학생관리',   question: '학생이 별표를 안 했어요',                  answer: '별표(☆)는 질문이 필요한 문제를 표시하는 항목입니다. 학생이 고민했지만 해결하지 못한 문제는 반드시 별표를 표시하도록 안내하세요. 별표 없이 넘어가는 것은 절대 금지 행동입니다.' },
    { id: 21, category: '학생관리',   question: '숙제 베낌이 의심될 때 어떻게 해요?',       answer: '조교 5초 판별 프로토콜을 사용하세요. STEP1(3초 스캔): 지나치게 깔끔/지우개 흔적 없음/계산 과정 없음/글씨체 변화 중 2개 이상이면 의심. STEP2(2초 질문): "이 문제 어떻게 풀었어요?" STEP3(5초 확정): 같은 문제 다시 풀리기 또는 숫자 바꿔 재풀이, 못 풀면 베낌 확정. 베낌 판별 SOP를 참고하세요.' },
    { id: 22, category: '루틴',       question: '첫 출근인데 뭐부터 해야 하나요?',          answer: '1. 서류 제출(등본, 재학증명서). 2. 성범죄 경력 조회(원장 안내 후 진행). 3. 이니셜 확인(원장에게 전달받기). 4. 조교할일 파일 확인(날짜-조교할일-이니셜 형식). 5. 학년별/반별 학생이름 확인. 6. 풀어볼거 진행(원장 설명 후). 신규 조교 온보딩 SOP를 참고하세요.' }
  ];

  var stored = localStorage.getItem('faqs');
  if (stored) { try { FAQS = JSON.parse(stored); } catch(e) {} }

  var CATEGORIES = ['전체', '복테', '오답노트', '채점', '비품', '제본기', '복사기', '파일관리', '학생관리', '루틴'];
  var activeCategory = '전체';
  var openId = null;

  function initFilters() {
    var row = document.getElementById('filterRow');
    row.innerHTML = CATEGORIES.map(function(c) {
      return '<button class="filter-chip' + (c === activeCategory ? ' active' : '') +
             '" onclick="setCategory(\'' + c + '\')">' + c + '</button>';
    }).join('');
  }

  function setCategory(cat) {
    activeCategory = cat;
    openId = null;
    initFilters();
    render();
  }

  function downloadFAQs() {
    downloadJSON(FAQS, 'faq_' + getToday() + '.json');
  }

  function uploadFAQs() {
    uploadJSON(function(data) {
      FAQS = data;
      localStorage.setItem('faqs', JSON.stringify(data));
      activeCategory = '전체'; openId = null;
      initFilters(); render();
    });
  }

  function downloadJSON(data, filename) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function uploadJSON(callback) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try { callback(JSON.parse(ev.target.result)); }
        catch(err) { alert('JSON 형식이 올바르지 않습니다.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function getToday() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function toggle(id) {
    openId = openId === id ? null : id;
    render();
  }

  function render() {
    var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    var filtered = FAQS.filter(function(f) {
      var matchCat = activeCategory === '전체' || f.category === activeCategory;
      var matchKey = !keyword || f.question.toLowerCase().includes(keyword) || f.answer.toLowerCase().includes(keyword);
      return matchCat && matchKey;
    });

    var container = document.getElementById('faqList');
    if (filtered.length === 0) {
      container.innerHTML = '<p class="empty-msg">검색 결과가 없습니다.</p>';
      return;
    }

    container.innerHTML = filtered.map(function(f, index) {
      var isOpen = openId === f.id;
      return [
        '<div class="faq-item' + (isOpen ? ' open' : '') + '" draggable="true" data-id="' + String(f.id) + '" onclick="toggle(' + f.id + ')">',
        '  <div class="faq-question">',
        '    <span class="drag-handle" onclick="event.stopPropagation()">&#10783;</span>',
        '    <div class="faq-q-main">',
        '      <span class="faq-q-text"><span class="faq-num">Q' + (index + 1) + '.</span>' + escHtml(f.question) + '</span>',
        '      <span class="faq-cat">' + escHtml(f.category || '') + '</span>',
        '    </div>',
        '    <span class="faq-arrow">▼</span>',
        '  </div>',
        '  <div class="faq-answer">' + linkify(escHtml(f.answer)) + '</div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function linkify(str) {
    str = str.replace(/(https?:\/\/[^\s<>"]+)/g, function(url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#4da3ff;text-decoration:underline;">' + url + '</a>';
    });
    str = str.replace(/((?:C:\\|D:\\|E:\\|\\\\)[^\s<>"]+)/g, function(path) {
      var escaped = path.replace(/'/g, "\\'");
      return '<button class="path-copy-btn" onclick="copyPath(\'' + escaped + '\')">📋 ' + path + '</button>';
    });
    return str;
  }

  function copyPath(path) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(path).then(function() { showToast(); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = path;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    }
  }

  function showToast() {
    var t = document.getElementById('toastMsg');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function addMouseDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('dragstart', function(e) {
      dragEl = e.target.closest('[data-id]');
      if (dragEl) setTimeout(function() { dragEl.classList.add('dragging'); }, 0);
    });
    container.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragEl) return;
      var after = getDragAfterElement(container, e.clientY);
      if (after == null) container.appendChild(dragEl);
      else container.insertBefore(dragEl, after);
    });
    container.addEventListener('dragend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  function getDragAfterElement(container, y) {
    var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
    return items.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function addTouchDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('touchstart', function(e) {
      var handle = e.target.closest('.drag-handle');
      if (!handle) return;
      dragEl = handle.closest('[data-id]');
      if (dragEl) dragEl.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
    container.addEventListener('touchmove', function(e) {
      if (!dragEl) return;
      e.preventDefault();
      var y = e.touches[0].clientY;
      var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
      var after = items.find(function(item) {
        var rect = item.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      });
      if (after) container.insertBefore(dragEl, after);
      else container.appendChild(dragEl);
    }, { passive: false });
    container.addEventListener('touchend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  initFilters();
  render();

  var faqContainer = document.getElementById('faqList');
  function faqSaveOrder(newOrder) {
    var allFaqs = JSON.parse(localStorage.getItem('faqs') || 'null') || FAQS;
    var idSet = {};
    newOrder.forEach(function(id) { idSet[id] = true; });
    var reordered = newOrder.map(function(id) {
      return allFaqs.find(function(f) { return String(f.id) === id; });
    }).filter(Boolean);
    var others = allFaqs.filter(function(f) { return !idSet[String(f.id)]; });
    FAQS = reordered.concat(others);
    localStorage.setItem('faqs', JSON.stringify(FAQS));
  }
  addMouseDrag(faqContainer, faqSaveOrder);
  addTouchDrag(faqContainer, faqSaveOrder);
</script>

<div class="toast-msg" id="toastMsg">경로가 복사되었습니다 📋</div>
</body>
</html>
