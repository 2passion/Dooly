<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAQ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  .search-box {
    background: #1c2333;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    margin-bottom: 16px;
  }
  .search-box::placeholder { opacity: 0.4; }

  .faq-list { display: flex; flex-direction: column; gap: 8px; }

  .faq-item {
    background: #1c2333;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .faq-question {
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .faq-q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
  }
  .faq-q-text::before {
    content: 'Q. ';
    color: #4da3ff;
  }

  .faq-arrow {
    font-size: 14px;
    opacity: 0.5;
    flex-shrink: 0;
    margin-top: 2px;
    transition: transform 0.2s;
  }
  .faq-item.open .faq-arrow { transform: rotate(180deg); }

  .faq-answer {
    display: none;
    padding: 0 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 12px;
  }
  .faq-answer::before {
    content: 'A. ';
    color: #4da3ff;
    font-weight: 700;
  }
  .faq-item.open .faq-answer { display: block; }

  .empty-msg {
    text-align: center;
    opacity: 0.4;
    margin-top: 48px;
    font-size: 15px;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 10px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 20px; }
</style>
</head>
<body>

<header>
  <h1>FAQ</h1>
</header>

<main>
  <input type="text" class="search-box" id="searchInput" placeholder="FAQ 검색..." oninput="render()">
  <div class="faq-list" id="faqList"></div>
</main>

<nav>
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html" class="active">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="05_Notice_v1.html">
    <span class="nav-icon">📢</span>
    <span>공지</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
</nav>

<script>
  var FAQS = [
    {
      id: 1,
      question: '복사기가 종이를 먹었어요',
      answer: '종이가 구겨진 경우 ADF를 사용하지 말고 수동(평판) 스캔으로 진행하세요. 무리하게 ADF에 넣으면 용지 걸림이 발생합니다. 복사기/스캔 SOP를 확인하세요.'
    },
    {
      id: 2,
      question: '학생이 복테를 못 찾겠어요',
      answer: '복테 보관함 배치 순서를 확인하세요. X존(고등): 고3→고2→고1, Y존(초중): 초등→중3→중2→중1 순서입니다. 학년 내 A반/B반 섹션파일 앞부분을 확인하세요. 복테 보관함 운영 SOP를 참고하세요.'
    },
    {
      id: 3,
      question: '오답기록표에 끝이라고 적혀있어요',
      answer: '오답노트 제본을 진행해야 합니다. 교재 전체 오답기록표를 수집하고, 20mm 링으로 제본 후 첫 페이지에 "만든날짜 + 오답노트"를 기입하여 학생에게 전달하세요. 오답노트 제본 SOP를 참고하세요.'
    },
    {
      id: 4,
      question: '연습장이 부족해요',
      answer: '연습장 보관함은 항상 5권을 유지해야 합니다. 5권 미만이면 즉시 제작하세요 (50매 양식, 12mm 링 사용). 연습장이 없는 학생은 이면지 보관함에서 이면지를 사용하도록 안내하세요.'
    },
    {
      id: 5,
      question: 'ADF 스캔과 수동 스캔 차이가 뭐예요?',
      answer: 'ADF(자동 원고 급지)는 깨끗하고 많은 양의 종이를 한 번에 스캔할 때 사용합니다. 수동(평판) 스캔은 종이가 얇거나 구겨진 경우에 사용합니다. 구겨진 종이를 ADF에 넣으면 용지 걸림이 발생하므로 반드시 수동으로 진행하세요.'
    },
    {
      id: 6,
      question: '제본링 사이즈는 어떻게 선택해요?',
      answer: '12mm 링: 연습장, 내신모의 10회분 등 얇은 자료에 사용합니다. 20mm 링: 오답노트, 기출 20개 학교 등 두꺼운 자료에 사용합니다. 소모품 재고 관리 SOP를 참고하세요.'
    },
    {
      id: 7,
      question: '제본기 찌꺼기는 언제 비워요?',
      answer: '제본기 사용 후 매번 반드시 하단 찌꺼기함(폐지통)을 비워야 합니다. 찌꺼기를 비우지 않으면 기기 고장의 원인이 됩니다. 제본기 사용 SOP를 참고하세요.'
    },
    {
      id: 8,
      question: '복테 보관함 배치 순서가 어떻게 돼요?',
      answer: 'X존(고등): 위에서부터 고3→고2→고1 순서입니다. Y존(초·중): 위에서부터 초등 전체→중3→중2→중1 순서입니다. 학년 칸 안에는 A반/B반 섹션파일이 있으며, 앞부분에 복테/프린트물, 뒷부분에 오답기록표를 보관합니다.'
    },
    {
      id: 9,
      question: '비품이 부족할 때 언제 보고해요?',
      answer: '재고가 20~30% 남았을 때 미리 원장에게 보고해야 합니다. 재고가 완전히 소진된 후 보고하면 업무 공백이 발생합니다. "A4 용지(또는 제본 링)가 며칠 내로 소진될 것 같습니다. 추가 준비가 필요합니다."라고 구체적으로 알리세요.'
    },
    {
      id: 10,
      question: '이면지는 어디에 보관해요?',
      answer: '이면지 보관함은 복테 제출함 아래에 있습니다. 스캔/프린트 후 발생한 뒷면이 깨끗한 종이를 이면지 보관함에 정리하세요. 연습장을 미지참한 학생이 자유롭게 꺼내 쓸 수 있도록 항상 정돈된 상태를 유지하세요.'
    },
    {
      id: 11,
      question: '복테 완료 기준이 뭐예요?',
      answer: '모든 별표(★) 문제가 큰 세모(△)로 해결된 상태가 완료입니다. 완료된 복테는 점수 칸에 세모 표시 후 스캔하여 학생 폴더에 저장합니다. 미완료 복테는 복테 보관함에 넣어 다음 시간에 다시 풀도록 합니다.'
    },
    {
      id: 12,
      question: '연습장은 몇 권 유지해야 해요?',
      answer: '연습장 보관함은 항상 5권을 유지해야 합니다 (50매 양식 사용). 오답기록표 정리 시마다 보관함을 확인하고, 5권 미만이면 즉시 제작하여 채워 넣습니다.'
    }
  ];

  var openId = null;

  function toggle(id) {
    openId = openId === id ? null : id;
    render();
  }

  function render() {
    var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    var filtered = FAQS.filter(function(f) {
      return !keyword || f.question.toLowerCase().includes(keyword) || f.answer.toLowerCase().includes(keyword);
    });

    var container = document.getElementById('faqList');
    if (filtered.length === 0) {
      container.innerHTML = '<p class="empty-msg">검색 결과가 없습니다.</p>';
      return;
    }

    container.innerHTML = filtered.map(function(f) {
      var isOpen = openId === f.id;
      return [
        '<div class="faq-item' + (isOpen ? ' open' : '') + '" onclick="toggle(' + f.id + ')">',
        '  <div class="faq-question">',
        '    <span class="faq-q-text">' + escHtml(f.question) + '</span>',
        '    <span class="faq-arrow">▼</span>',
        '  </div>',
        '  <div class="faq-answer">' + escHtml(f.answer) + '</div>',
        '</div>'
      ].join('');
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  render();
</script>

</body>
</html>
