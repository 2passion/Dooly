<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>업무 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  .sync-bar {
    background: #0b0f1a;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(77,163,255,0.15);
    flex-shrink: 0;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  .add-btn {
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 8px;
  }

  /* JSON 버튼 */
  .data-btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .btn-download { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
  .btn-upload   { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }

  /* 필터 */
  .filter-section { margin-bottom: 8px; }
  .filter-label { font-size: 11px; opacity: 0.5; margin-bottom: 6px; }
  .filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    background: #1c2333;
    border: 1px solid rgba(77,163,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .filter-chip.active {
    background: #4da3ff;
    border-color: #4da3ff;
    color: #0b0f1a;
    font-weight: 700;
  }

  /* 업무 추가 폼 */
  .form-panel {
    background: #1c2333;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    margin-top: 12px;
    display: none;
  }
  .form-panel.visible { display: block; }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: #0b0f1a;
    border: 1px solid rgba(77,163,255,0.3);
    border-radius: 8px;
    color: #ffffff;
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
    -webkit-appearance: none;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
  }
  .form-group input,
  .form-group select { min-height: 44px; }
  .form-group textarea { min-height: 100px; resize: none; line-height: 1.5; }
  .form-group select option { background: #0b0f1a; }

  .assignee-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .assignee-chip {
    background: rgba(77,163,255,0.15);
    border: 1px solid rgba(77,163,255,0.3);
    color: #4da3ff;
    border-radius: 16px;
    font-size: 12px;
    padding: 4px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .btn-save {
    flex: 1;
    background: #4da3ff;
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    min-height: 48px;
    cursor: pointer;
  }
  .btn-cancel {
    flex: 1;
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    font-size: 15px;
    min-height: 48px;
    cursor: pointer;
  }

  /* 업무 카드 */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-card {
    background: #1c2333;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .task-card:active { background: #263045; }

  .task-card.edit-mode {
    cursor: default;
    padding: 16px;
  }
  .task-card.edit-mode:active { background: #1c2333; }

  .task-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .task-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    flex: 1;
  }
  .signal {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .task-content {
    font-size: 13px;
    opacity: 0.65;
    line-height: 1.5;
    margin-bottom: 8px;
    word-break: break-all;
  }

  .task-footer {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .task-assignee {
    font-size: 13px;
    opacity: 0.6;
    flex: 1;
  }

  .badge {
    display: inline-block;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
  }
  .badge-pending     { background: rgba(150,150,150,0.25); color: #aaa; }
  .badge-in_progress { background: rgba(77,163,255,0.25);  color: #4da3ff; }
  .badge-completed   { background: rgba(60,200,100,0.25);  color: #3cc864; }

  .edit-btn {
    background: transparent;
    border: 1px solid rgba(77,163,255,0.3);
    color: #4da3ff;
    border-radius: 6px;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .delete-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.4);
    border-radius: 6px;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .empty-msg {
    text-align: center;
    opacity: 0.4;
    margin-top: 48px;
    font-size: 15px;
  }

  .drag-handle {
    color: rgba(255,255,255,0.2);
    font-size: 18px;
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
  }
  .dragging {
    opacity: 0.4;
    background: #263045 !important;
  }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }
</style>
</head>
<body>

<!-- 동기화 상태 표시 -->
<div class="sync-bar">
  <span id="sync-status" style="font-size: 14px; font-weight: bold;">🟡 확인 중...</span>
  <button id="sync-btn"
    onclick="syncTasks()"
    style="display:none; padding: 4px 12px; font-size: 13px;
           background: #4CAF50; color: white; border: none;
           border-radius: 6px; cursor: pointer;">
    🔄 동기화
  </button>
</div>

<header>
  <h1>업무 관리</h1>
  <button class="add-btn" onclick="toggleForm()">+ 업무 추가</button>
</header>

<main>
  <div class="data-btn-row">
    <button class="btn-download" onclick="downloadTasks()">📥 JSON 다운로드</button>
    <button class="btn-upload"   onclick="uploadTasks()">📤 JSON 업로드</button>
  </div>

  <div class="filter-section">
    <div class="filter-label">우선순위</div>
    <div class="filter-row" id="priorityFilter"></div>
  </div>
  <div class="filter-section" style="margin-bottom:8px;">
    <div class="filter-label">업무진행상황</div>
    <div class="filter-row" id="statusFilter"></div>
  </div>
  <div class="filter-section" style="margin-bottom:12px;">
    <div class="filter-label">담당자</div>
    <div class="filter-row" id="assigneeFilter"></div>
  </div>

  <div class="form-panel" id="formPanel">
    <div class="form-group">
      <label>업무 제목</label>
      <input type="text" id="inputTitle" placeholder="업무 제목 입력">
    </div>
    <div class="form-group">
      <label>담당자</label>
      <input type="text" id="inputAssignee" placeholder="직접 입력 또는 아래서 선택">
      <div class="assignee-chips" id="assigneeChips"></div>
    </div>
    <div class="form-group">
      <label>우선순위</label>
      <select id="inputPriority">
        <option value="normal">보통</option>
        <option value="today">오늘</option>
        <option value="urgent">즉시</option>
      </select>
    </div>
    <div class="form-group">
      <label>업무 내용 (선택)</label>
      <textarea id="inputContent" placeholder="업무 내용을 입력하세요..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-save" onclick="saveTask()">저장</button>
      <button class="btn-cancel" onclick="toggleForm()">취소</button>
    </div>
  </div>

  <div class="task-list" id="taskList"></div>
</main>

<script>
  // ─── Task API 설정 ───────────────────────────────────────
  const API_BASE = "http://192.168.0.10:8001";
  const OFFLINE_KEY = "tasks_offline";
  let isOnline = false;

  async function checkOnlineStatus() {
    try {
      const res = await fetch(`${API_BASE}/ping`, {
        signal: AbortSignal.timeout(3000)
      });
      const data = await res.json();
      isOnline = data.status === "online";
    } catch {
      isOnline = false;
    }
    updateStatusBadge();
  }

  function updateStatusBadge() {
    const badge = document.getElementById("sync-status");
    const syncBtn = document.getElementById("sync-btn");
    if (isOnline) {
      badge.textContent = "🟢 온라인";
      badge.style.color = "green";
      syncBtn.style.display = "none";
    } else {
      badge.textContent = "🔴 오프라인";
      badge.style.color = "red";
      syncBtn.style.display = "inline-block";
    }
  }

  async function loadTasks() {
    if (isOnline) {
      const res = await fetch(`${API_BASE}/tasks`);
      return await res.json();
    } else {
      return JSON.parse(localStorage.getItem(OFFLINE_KEY) || "[]");
    }
  }

  async function addTask(task) {
    if (isOnline) {
      await fetch(`${API_BASE}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(task)
      });
    } else {
      const tasks = JSON.parse(localStorage.getItem(OFFLINE_KEY) || "[]");
      task.id = Date.now();
      task.created_at = new Date().toLocaleString("ko-KR");
      tasks.push(task);
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(tasks));
    }
  }

  async function updateTask(id, updated) {
    if (isOnline) {
      await fetch(`${API_BASE}/tasks/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updated)
      });
    } else {
      const tasks = JSON.parse(localStorage.getItem(OFFLINE_KEY) || "[]");
      const idx = tasks.findIndex(t => String(t.id) === String(id));
      if (idx !== -1) tasks[idx] = { ...tasks[idx], ...updated };
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(tasks));
    }
  }

  async function deleteTask(id) {
    if (isOnline) {
      await fetch(`${API_BASE}/tasks/${id}`, { method: "DELETE" });
    } else {
      const tasks = JSON.parse(localStorage.getItem(OFFLINE_KEY) || "[]");
      localStorage.setItem(OFFLINE_KEY,
        JSON.stringify(tasks.filter(t => String(t.id) !== String(id))));
    }
  }

  async function syncTasks() {
    const syncBtn = document.getElementById("sync-btn");
    const badge = document.getElementById("sync-status");
    badge.textContent = "🟡 동기화 중...";
    badge.style.color = "orange";
    syncBtn.disabled = true;

    await checkOnlineStatus();

    if (isOnline) {
      const offlineTasks = JSON.parse(localStorage.getItem(OFFLINE_KEY) || "[]");
      for (const task of offlineTasks) {
        await fetch(`${API_BASE}/tasks`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(task)
        });
      }
      localStorage.removeItem(OFFLINE_KEY);
      badge.textContent = "✅ 동기화 완료";
      badge.style.color = "green";
      setTimeout(() => updateStatusBadge(), 2000);
    } else {
      badge.textContent = "🔴 오프라인 (동기화 실패)";
      badge.style.color = "red";
    }
    syncBtn.disabled = false;
    await renderTasks();
  }

  // ─── 상수 ───────────────────────────────────────────────
  var STATUS_CYCLE = ['pending', 'in_progress', 'completed'];
  var STATUS_LABEL = { pending: '대기', in_progress: '진행중', completed: '완료' };
  var PRIORITY_COLOR = { urgent: '#ff4444', today: '#ffcc00', normal: '#3cc864' };
  var PRIORITY_LABEL = { urgent: '즉시', today: '오늘', normal: '보통' };
  var PRIORITY_MAP   = { '즉시': 'urgent', '오늘': 'today', '보통': 'normal' };

  var activePriority = '전체';
  var activeAssignee = '전체';
  var activeStatus = '전체';
  var editingId = null;

  /* ── 담당자 데이터 (localStorage 유지) ── */
  function loadAssigneeNames() {
    var raw = JSON.parse(localStorage.getItem('assignees') || '[]');
    return raw.map(function(a) { return typeof a === 'string' ? a : a.name; });
  }

  function addAssigneeIfNew(name) {
    if (!name || name === '미지정') return;
    var raw = JSON.parse(localStorage.getItem('assignees') || '[]');
    var names = raw.map(function(a) { return typeof a === 'string' ? a : a.name; });
    if (names.indexOf(name) === -1) {
      raw.push({ name: name, memo: '' });
      localStorage.setItem('assignees', JSON.stringify(raw));
    }
  }

  /* ── XSS 방지 ── */
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ── 신호등 ── */
  function signal(priority) {
    var p = priority || 'normal';
    var color = PRIORITY_COLOR[p] || PRIORITY_COLOR.normal;
    var label = PRIORITY_LABEL[p] || p;
    return '<span class="signal" style="color:' + color + '">● ' + label + '</span>';
  }

  /* ── 날짜 ── */
  function getToday() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  /* ── 담당자 칩 렌더 ── */
  function renderAssigneeChips(containerId, inputId) {
    var el = document.getElementById(containerId);
    if (!el) return;
    var assignees = loadAssigneeNames();
    if (assignees.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = assignees.map(function(a) {
      return '<button type="button" class="assignee-chip" onclick="event.stopPropagation();document.getElementById(\'' + inputId + '\').value=\'' + escAttr(a) + '\'">' + escHtml(a) + '</button>';
    }).join('');
  }

  /* ── 필터 렌더 ── */
  function renderFilters() {
    var priorities = ['전체', '즉시', '오늘', '보통'];
    document.getElementById('priorityFilter').innerHTML = priorities.map(function(p) {
      return '<button class="filter-chip' + (p === activePriority ? ' active' : '') +
             '" onclick="setPriorityFilter(\'' + p + '\')">' + p + '</button>';
    }).join('');

    var statuses = ['전체', '대기', '진행중', '완료'];
    document.getElementById('statusFilter').innerHTML = statuses.map(function(s) {
      return '<button class="filter-chip' + (s === activeStatus ? ' active' : '') +
             '" onclick="setStatusFilter(\'' + s + '\')">' + s + '</button>';
    }).join('');

    var assignees = ['전체'].concat(loadAssigneeNames());
    document.getElementById('assigneeFilter').innerHTML = assignees.map(function(a) {
      return '<button class="filter-chip' + (a === activeAssignee ? ' active' : '') +
             '" onclick="setAssigneeFilter(\'' + escAttr(a) + '\')">' + escHtml(a) + '</button>';
    }).join('');
  }

  function setPriorityFilter(p) { activePriority = p; renderFilters(); renderTasks(); }
  function setStatusFilter(s) { activeStatus = s; renderFilters(); renderTasks(); }
  function setAssigneeFilter(a) { activeAssignee = a; renderFilters(); renderTasks(); }

  /* ── 폼 토글 ── */
  function toggleForm() {
    var panel = document.getElementById('formPanel');
    panel.classList.toggle('visible');
    if (panel.classList.contains('visible')) {
      renderAssigneeChips('assigneeChips', 'inputAssignee');
      document.getElementById('inputTitle').focus();
    }
  }

  /* ── 업무 저장 ── */
  async function saveTask() {
    var title    = document.getElementById('inputTitle').value.trim();
    var assignee = document.getElementById('inputAssignee').value.trim();
    var priority = document.getElementById('inputPriority').value;
    var content  = document.getElementById('inputContent').value.trim();

    if (!title) { alert('업무 제목을 입력하세요.'); return; }

    await addTask({
      title: title,
      assignee: assignee || '미지정',
      content: content,
      status: 'pending',
      priority: priority,
      created_at: getToday()
    });
    addAssigneeIfNew(assignee);

    document.getElementById('inputTitle').value    = '';
    document.getElementById('inputAssignee').value = '';
    document.getElementById('inputPriority').value = 'normal';
    document.getElementById('inputContent').value  = '';
    document.getElementById('formPanel').classList.remove('visible');

    renderFilters();
    await renderTasks();
  }

  /* ── 상태 순환 ── */
  async function cycleStatus(id) {
    var tasks = await loadTasks();
    var task = tasks.find(function(t) { return String(t.id) === String(id); });
    if (!task) return;
    var idx = STATUS_CYCLE.indexOf(task.status);
    var newStatus = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
    await updateTask(id, { status: newStatus });
    await renderTasks();
  }

  /* ── 삭제 ── */
  async function handleDeleteTask(id, e) {
    e.stopPropagation();
    if (!confirm('이 업무를 삭제하시겠습니까?')) return;
    await deleteTask(id);
    await renderTasks();
  }

  /* ── 수정 모드 진입 ── */
  function editTask(id, e) {
    e.stopPropagation();
    editingId = id;
    renderTasks();
  }

  function cancelEdit(e) {
    if (e) e.stopPropagation();
    editingId = null;
    renderTasks();
  }

  async function saveEdit(id, e) {
    if (e) e.stopPropagation();
    var title    = document.getElementById('editTitle_'    + id).value.trim();
    var assignee = document.getElementById('editAssignee_' + id).value.trim();
    var priority = document.getElementById('editPriority_' + id).value;
    var content  = document.getElementById('editContent_'  + id).value.trim();

    if (!title) { alert('업무 제목을 입력하세요.'); return; }

    await updateTask(id, {
      title: title,
      assignee: assignee || '미지정',
      priority: priority,
      content: content
    });
    addAssigneeIfNew(assignee);
    editingId = null;
    renderFilters();
    await renderTasks();
  }

  /* ── 수정 폼 HTML 생성 ── */
  function renderEditForm(t) {
    var assignees = loadAssigneeNames();
    var chipsHtml = assignees.map(function(a) {
      return '<button type="button" class="assignee-chip" onclick="event.stopPropagation();document.getElementById(\'editAssignee_' + t.id + '\').value=\'' + escAttr(a) + '\'">' + escHtml(a) + '</button>';
    }).join('');

    var opts = ['normal', 'today', 'urgent'].map(function(v) {
      return '<option value="' + v + '"' + (t.priority === v ? ' selected' : '') + '>' + PRIORITY_LABEL[v] + '</option>';
    }).join('');

    return [
      '<div class="task-card edit-mode" data-id="' + t.id + '" draggable="false">',
      '  <div class="form-group">',
      '    <label>업무 제목</label>',
      '    <input type="text" id="editTitle_' + t.id + '" value="' + escAttr(t.title) + '" onclick="event.stopPropagation()">',
      '  </div>',
      '  <div class="form-group">',
      '    <label>담당자</label>',
      '    <input type="text" id="editAssignee_' + t.id + '" value="' + escAttr(t.assignee) + '" onclick="event.stopPropagation()">',
      '    <div class="assignee-chips">' + chipsHtml + '</div>',
      '  </div>',
      '  <div class="form-group">',
      '    <label>우선순위</label>',
      '    <select id="editPriority_' + t.id + '" onclick="event.stopPropagation()">' + opts + '</select>',
      '  </div>',
      '  <div class="form-group">',
      '    <label>업무 내용 (선택)</label>',
      '    <textarea id="editContent_' + t.id + '" onclick="event.stopPropagation()">' + escHtml(t.content || '') + '</textarea>',
      '  </div>',
      '  <div class="form-actions">',
      '    <button class="btn-save"   onclick="saveEdit(\'' + t.id + '\', event)">저장</button>',
      '    <button class="btn-cancel" onclick="cancelEdit(event)">취소</button>',
      '  </div>',
      '</div>'
    ].join('');
  }

  /* ── 목록 렌더 ── */
  async function renderTasks() {
    var tasks = await loadTasks();
    var container = document.getElementById('taskList');

    var STATUS_MAP = { '대기': 'pending', '진행중': 'in_progress', '완료': 'completed' };
    var filtered = tasks.filter(function(t) {
      var matchP = activePriority === '전체' || t.priority === PRIORITY_MAP[activePriority];
      var matchA = activeAssignee === '전체' || t.assignee === activeAssignee;
      var matchS = activeStatus === '전체' || t.status === STATUS_MAP[activeStatus];
      return matchP && matchA && matchS;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p class="empty-msg">등록된 업무가 없습니다.</p>';
      renderAssigneeChips('assigneeChips', 'inputAssignee');
      return;
    }

    container.innerHTML = filtered.map(function(t) {
      if (String(editingId) === String(t.id)) return renderEditForm(t);

      var label = STATUS_LABEL[t.status] || t.status;
      var contentHtml = t.content
        ? '  <div class="task-content">' + escHtml(t.content).replace(/\n/g, '<br>') + '</div>'
        : '';

      return [
        '<div class="task-card" draggable="true" data-id="' + t.id + '" onclick="cycleStatus(\'' + t.id + '\')">',
        '  <div class="task-top">',
        '    <span class="drag-handle" onclick="event.stopPropagation()">&#10783;</span>',
        '    <span class="task-title">' + escHtml(t.title) + '</span>',
        '    ' + signal(t.priority),
        '  </div>',
        contentHtml,
        '  <div class="task-footer">',
        '    <span class="task-assignee">담당: ' + escHtml(t.assignee) + '</span>',
        '    <span class="badge badge-' + t.status + '">' + label + '</span>',
        '    <button class="edit-btn"   onclick="editTask(\'' + t.id + '\', event)">수정</button>',
        '    <button class="delete-btn" onclick="handleDeleteTask(\'' + t.id + '\', event)">삭제</button>',
        '  </div>',
        '</div>'
      ].join('');
    }).join('');

    renderAssigneeChips('assigneeChips', 'inputAssignee');
  }

  /* ── JSON 다운로드/업로드 ── */
  function downloadTasks() {
    loadTasks().then(function(data) {
      downloadJSON(data, 'task_' + getToday() + '.json');
    });
  }

  function uploadTasks() {
    uploadJSON(function(data) {
      if (isOnline) {
        alert('온라인 모드에서는 JSON 업로드가 지원되지 않습니다.\n오프라인 상태에서 사용하세요.');
        return;
      }
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(data));
      renderFilters();
      renderTasks();
    });
  }

  function downloadJSON(data, filename) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function uploadJSON(callback) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try { callback(JSON.parse(ev.target.result)); }
        catch(err) { alert('JSON 형식이 올바르지 않습니다.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  /* ── 드래그 정렬 ── */
  function addMouseDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('dragstart', function(e) {
      dragEl = e.target.closest('[data-id]');
      if (dragEl) setTimeout(function() { dragEl.classList.add('dragging'); }, 0);
    });
    container.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragEl) return;
      var after = getDragAfterElement(container, e.clientY);
      if (after == null) container.appendChild(dragEl);
      else container.insertBefore(dragEl, after);
    });
    container.addEventListener('dragend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  function getDragAfterElement(container, y) {
    var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
    return items.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function addTouchDrag(container, saveOrder) {
    var dragEl = null;
    container.addEventListener('touchstart', function(e) {
      var handle = e.target.closest('.drag-handle');
      if (!handle) return;
      dragEl = handle.closest('[data-id]');
      if (dragEl) dragEl.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
    container.addEventListener('touchmove', function(e) {
      if (!dragEl) return;
      e.preventDefault();
      var y = e.touches[0].clientY;
      var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
      var after = items.find(function(item) {
        var rect = item.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      });
      if (after) container.insertBefore(dragEl, after);
      else container.appendChild(dragEl);
    }, { passive: false });
    container.addEventListener('touchend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      saveOrder(Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); }));
      dragEl = null;
    });
  }

  /* ── 초기화 ── */
  window.addEventListener("load", async function() {
    await checkOnlineStatus();
    renderFilters();
    await renderTasks();
    setInterval(checkOnlineStatus, 30000);

    var taskContainer = document.getElementById('taskList');
    function taskSaveOrder(newOrder) {
      if (!isOnline) {
        var allTasks = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
        var idSet = {};
        newOrder.forEach(function(id) { idSet[id] = true; });
        var reordered = newOrder.map(function(id) {
          return allTasks.find(function(t) { return String(t.id) === String(id); });
        }).filter(Boolean);
        var others = allTasks.filter(function(t) { return !idSet[String(t.id)]; });
        localStorage.setItem(OFFLINE_KEY, JSON.stringify(reordered.concat(others)));
      }
    }
    addMouseDrag(taskContainer, taskSaveOrder);
    addTouchDrag(taskContainer, taskSaveOrder);
  });
</script>
