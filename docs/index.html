<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KING Assistant OS</title>
<link rel="manifest" href="/Dooly/manifest.json">
<meta name="theme-color" content="#4da3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KING">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0f1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
  }

  header {
    background: #0b0f1a;
    border-bottom: 1px solid rgba(77,163,255,0.2);
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #4da3ff;
    letter-spacing: 0.5px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    padding-bottom: 8px;
  }

  .greeting {
    font-size: 16px;
    opacity: 0.6;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* 업무 현황 카드 */
  .status-card {
    background: #1c2333;
    border-radius: 12px;
    padding: 16px 20px 12px;
    margin-bottom: 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .status-card:active { background: #263045; }

  .status-counts {
    display: flex;
    gap: 20px;
    margin-bottom: 8px;
  }
  .status-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .status-label { font-size: 12px; opacity: 0.6; }
  .status-count { font-size: 28px; font-weight: 700; color: #4da3ff; }
  .status-hint  { font-size: 11px; opacity: 0.4; }

  /* 달력 */
  .calendar-wrap { background: #1c2333; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-size: 15px; font-weight: 700; }
  .cal-nav { background: transparent; border: none; color: #4da3ff; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .cal-view-toggle { display: flex; gap: 6px; }
  .cal-view-btn { background: #0b0f1a; border: 1px solid rgba(77,163,255,0.2); color: rgba(255,255,255,0.5); border-radius: 12px; font-size: 11px; padding: 3px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cal-view-btn.active { background: #4da3ff; border-color: #4da3ff; color: #0b0f1a; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day-header { text-align: center; font-size: 11px; opacity: 0.5; padding: 4px 0; }
  .cal-day-header:first-child { color: #ff6b6b; opacity: 0.8; }
  .cal-day-header:last-child  { color: #4da3ff; opacity: 0.8; }
  .cal-day {
    text-align: center;
    padding: 4px 2px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    position: relative;
    min-height: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-day:active { background: #263045; }
  .cal-day.today {
    background: #4da3ff;
    color: #0b0f1a;
    font-weight: 700;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    margin: 0 auto;
  }
  .cal-day.selected { background: rgba(77,163,255,0.2); border-radius: 8px; }
  .cal-day.today.selected { background: #4da3ff; border-radius: 50%; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: #4da3ff; }
  .cal-day.today .cal-dot { background: rgba(255,255,255,0.6); }

  /* 날짜별 업무 목록 */
  .date-tasks { background: #1c2333; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .date-tasks-title { font-size: 13px; font-weight: 700; color: #4da3ff; margin-bottom: 12px; }
  .assignee-group { margin-bottom: 8px; }
  .assignee-group-header {
    background: #0b0f1a;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .assignee-group-body { display: none; padding: 8px 0 0 12px; }
  .assignee-group.open .assignee-group-body { display: block; }
  .assignee-task-item {
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .assignee-task-item:last-child { border-bottom: none; }
  .no-task-msg { font-size: 13px; opacity: 0.4; text-align: center; padding: 12px 0; }

  /* 공지 아코디언 */
  .notice-item {
    background: #1c2333;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .notice-header {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .notice-left {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .notice-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .notice-date  { font-size: 12px; opacity: 0.5; }
  .notice-arrow { font-size: 14px; opacity: 0.5; flex-shrink: 0; transition: transform 0.2s; }
  .notice-item.open .notice-arrow { transform: rotate(180deg); }
  .notice-detail {
    display: none;
    padding: 12px 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .notice-item.open .notice-detail { display: block; }

  .section-block { margin-bottom: 28px; }

  nav {
    background: #1c2333;
    border-top: 1px solid rgba(77,163,255,0.15);
    display: flex;
    height: 60px;
    flex-shrink: 0;
  }
  nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: rgba(255,255,255,0.45);
    font-size: 9px;
    gap: 3px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }
  nav a.active { color: #4da3ff; }
  nav a .nav-icon { font-size: 18px; }

  /* 공지 JSON 버튼 */
  .notice-btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .notice-btn-dl { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
  .notice-btn-ul { flex: 1; background: #1c2333; border: 1px solid rgba(77,163,255,0.3); color: #4da3ff; border-radius: 8px; font-size: 14px; padding: 10px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }

  /* 드래그 핸들 */
  .notice-drag-handle {
    color: rgba(255,255,255,0.2);
    font-size: 18px;
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    padding-right: 8px;
  }
  .notice-item.dragging {
    opacity: 0.4;
    background: #263045 !important;
  }
</style>
<script src="data.js"></script>
</head>
<body>

<header>
  <h1>KING Assistant OS</h1>
</header>

<main>
  <p class="greeting">안녕하세요, 둘리(Dooly)입니다.</p>

  <p class="section-title">업무 현황</p>
  <div class="status-card" onclick="location.href='02_Task_v1.html'">
    <div class="status-counts">
      <div class="status-item">
        <span class="status-label">대기중</span>
        <span class="status-count" id="count-pending">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">진행중</span>
        <span class="status-count" id="count-progress">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">완료</span>
        <span class="status-count" id="count-done">0</span>
      </div>
    </div>
    <div class="status-hint">탭하여 업무 관리로 이동</div>
  </div>

  <div class="calendar-wrap">
    <div class="cal-header">
      <button class="cal-nav" onclick="prevMonth()">◀</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav" onclick="nextMonth()">▶</button>
      <div class="cal-view-toggle">
        <button class="cal-view-btn active" id="btnMonth" onclick="setCalView('month')">월간</button>
        <button class="cal-view-btn" id="btnWeek" onclick="setCalView('week')">주간</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div id="dateTasks"></div>

  <div class="section-block">
    <p class="section-title">공지사항</p>
    <div class="notice-btn-row">
      <button class="notice-btn-dl" onclick="downloadNotices()">📥 JSON 다운로드</button>
      <button class="notice-btn-ul" onclick="uploadNotices()">📤 JSON 업로드</button>
    </div>
    <div id="noticeList"></div>
  </div>
</main>

<nav>
  <a href="index.html" class="active">
    <span class="nav-icon">🏠</span>
    <span>홈</span>
  </a>
  <a href="02_Task_v1.html">
    <span class="nav-icon">📋</span>
    <span>업무</span>
  </a>
  <a href="03_SOP_v1.html">
    <span class="nav-icon">📖</span>
    <span>SOP</span>
  </a>
  <a href="04_FAQ_v1.html">
    <span class="nav-icon">❓</span>
    <span>FAQ</span>
  </a>
  <a href="06_Dooly_v1.html">
    <span class="nav-icon">🤖</span>
    <span>Dooly</span>
  </a>
  <a href="07_Settings_v1.html">
    <span class="nav-icon">⚙️</span>
    <span>설정</span>
  </a>
</nav>

<script>
  /* ── 공지 데이터 ── */
  var NOTICES = [
    {
      id: 1,
      title: '시스템 오픈 안내',
      date: '2026-06-25',
      body: 'KING Assistant OS v1.0이 오픈되었습니다.\n\n이 시스템은 조교 업무 운영을 지원하기 위한 시스템입니다.\n\n주요 기능:\n- 업무 등록 및 상태 관리\n- SOP 검색\n- FAQ 검색\n- Dooly AI 질의응답\n\n사용 중 문의사항은 담당자에게 문의해 주세요.'
    },
    {
      id: 2,
      title: '조교 업무 매뉴얼 배포',
      date: '2026-06-25',
      body: '조교 업무 매뉴얼이 배포되었습니다.\n\n매뉴얼 내용:\n- 복테 관리 방법\n- 오답노트 관리 방법\n- 비품 관리 방법\n- 복사기 사용 방법\n\n모든 조교는 매뉴얼을 숙지하고 업무에 임해 주세요.\n\n문의사항은 원장에게 직접 문의해 주세요.'
    }
  ];

  var openId = null;

  function toggle(id) {
    openId = openId === id ? null : id;
    render();
  }

  /* ── 홈 렌더 (업무 카운트 + 공지) ── */
  function render() {
    var tasks = JSON.parse(localStorage.getItem('tasks_offline') || '[]');
    document.getElementById('count-pending').textContent  = tasks.filter(function(t) { return t.status === 'pending'; }).length;
    document.getElementById('count-progress').textContent = tasks.filter(function(t) { return t.status === 'in_progress'; }).length;
    document.getElementById('count-done').textContent     = tasks.filter(function(t) { return t.status === 'completed'; }).length;

    var stored = localStorage.getItem('notices');
    var data = stored ? JSON.parse(stored) : NOTICES;

    document.getElementById('noticeList').innerHTML = data.map(function(n) {
      var isOpen = openId === n.id;
      return [
        '<div class="notice-item' + (isOpen ? ' open' : '') + '" draggable="true" data-id="' + String(n.id) + '">',
        '  <div class="notice-header" onclick="toggle(' + n.id + ')">',
        '    <span class="notice-drag-handle" onclick="event.stopPropagation()">&#10783;</span>',
        '    <div class="notice-left">',
        '      <div class="notice-title">' + escHtml(n.title) + '</div>',
        '      <div class="notice-date">' + n.date + '</div>',
        '    </div>',
        '    <span class="notice-arrow">▼</span>',
        '  </div>',
        '  <div class="notice-detail">' + escHtml(n.body).replace(/\n/g, '<br>') + '</div>',
        '</div>'
      ].join('');
    }).join('');

    initNoticeDrag();
  }

  /* ── 달력 ── */
  var todayObj = new Date();
  var calYear  = todayObj.getFullYear();
  var calMonth = todayObj.getMonth();
  var calView  = 'month';
  var selectedDate = null;
  var weekOffset = 0;

  function formatDate(y, m, d) {
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function formatDisplayDate(dateStr) {
    var p = dateStr.split('-');
    return p[0] + '년 ' + parseInt(p[1]) + '월 ' + parseInt(p[2]) + '일';
  }

  function prevMonth() {
    if (calView === 'week') {
      weekOffset--;
      renderCalendar();
      return;
    }
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  }
  function nextMonth() {
    if (calView === 'week') {
      weekOffset++;
      renderCalendar();
      return;
    }
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }
  function setCalView(v) {
    calView = v;
    weekOffset = 0;
    document.getElementById('btnMonth').className = 'cal-view-btn' + (v === 'month' ? ' active' : '');
    document.getElementById('btnWeek').className  = 'cal-view-btn' + (v === 'week'  ? ' active' : '');
    renderCalendar();
  }
  function selectDate(dateStr) {
    selectedDate = (selectedDate === dateStr) ? null : dateStr;
    renderCalendar();
  }

  function renderCalendar() {
    var now = new Date();
    var todayStr = formatDate(now.getFullYear(), now.getMonth() + 1, now.getDate());

    var tasks = JSON.parse(localStorage.getItem('tasks_offline') || '[]');
    var taskDates = {};
    tasks.forEach(function(t) { if (t.created_at) taskDates[t.created_at] = true; });

    var DAY_KO = ['일','월','화','수','목','금','토'];
    var headers = DAY_KO.map(function(d) {
      return '<div class="cal-day-header">' + d + '</div>';
    }).join('');

    var cells = [];
    var title;

    if (calView === 'month') {
      title = calYear + '년 ' + (calMonth + 1) + '월';
      var firstDay    = new Date(calYear, calMonth, 1).getDay();
      var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

      for (var i = 0; i < firstDay; i++) {
        cells.push('<div class="cal-day"></div>');
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var ds  = formatDate(calYear, calMonth + 1, d);
        var cls = 'cal-day';
        if (ds === todayStr)    cls += ' today';
        if (ds === selectedDate) cls += ' selected';
        var dot = (taskDates[ds] && ds !== todayStr) ? '<span class="cal-dot"></span>' : '';
        cells.push('<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')">' + d + dot + '</div>');
      }
    } else {
      var sun = new Date(now);
      sun.setDate(now.getDate() - now.getDay() + (weekOffset * 7));
      var sat = new Date(sun); sat.setDate(sun.getDate() + 6);
      title = (sun.getMonth() + 1) + '월 ' + sun.getDate() + '일 ~ ' +
              (sat.getMonth() + 1) + '월 ' + sat.getDate() + '일';

      for (var i = 0; i < 7; i++) {
        var day = new Date(sun); day.setDate(sun.getDate() + i);
        var ds  = formatDate(day.getFullYear(), day.getMonth() + 1, day.getDate());
        var cls = 'cal-day';
        if (ds === todayStr)    cls += ' today';
        if (ds === selectedDate) cls += ' selected';
        var dot = (taskDates[ds] && ds !== todayStr) ? '<span class="cal-dot"></span>' : '';
        cells.push('<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')">' + day.getDate() + dot + '</div>');
      }
    }

    document.getElementById('calTitle').textContent = title;
    document.getElementById('calGrid').innerHTML = headers + cells.join('');

    if (selectedDate) renderDateTasks(selectedDate);
    else document.getElementById('dateTasks').innerHTML = '';
  }

  function renderDateTasks(dateStr) {
    var tasks = JSON.parse(localStorage.getItem('tasks_offline') || '[]')
                  .filter(function(t) { return t.created_at === dateStr; });
    var container = document.getElementById('dateTasks');
    var titleHtml = '<div class="date-tasks-title">' + formatDisplayDate(dateStr) + ' 업무</div>';

    if (tasks.length === 0) {
      container.innerHTML = '<div class="date-tasks">' + titleHtml +
        '<div class="no-task-msg">이 날의 업무가 없습니다.</div></div>';
      return;
    }

    var PCOLOR = { urgent: '#ff4444', today: '#ffcc00', normal: '#3cc864' };
    var PLABEL = { urgent: '즉시', today: '오늘', normal: '보통' };

    var groups = {}, order = [];
    tasks.forEach(function(t) {
      if (!groups[t.assignee]) { groups[t.assignee] = []; order.push(t.assignee); }
      groups[t.assignee].push(t);
    });

    var groupsHtml = order.map(function(assignee) {
      var atasks = groups[assignee];
      var itemsHtml = atasks.map(function(t) {
        var p = t.priority || 'normal';
        return '<div class="assignee-task-item">' +
          '<span style="color:' + (PCOLOR[p] || PCOLOR.normal) + ';font-weight:700;font-size:12px;">● ' + (PLABEL[p] || p) + '</span>' +
          '<span>' + escHtml(t.title) + '</span>' +
          '</div>';
      }).join('');
      return '<div class="assignee-group" onclick="this.classList.toggle(\'open\')">' +
        '<div class="assignee-group-header">' +
          '<span>' + escHtml(assignee) + ' <span style="opacity:0.5;font-size:12px;">(' + atasks.length + ')</span></span>' +
          '<span style="font-size:12px;opacity:0.5;transition:transform 0.2s;">▼</span>' +
        '</div>' +
        '<div class="assignee-group-body">' + itemsHtml + '</div>' +
        '</div>';
    }).join('');

    container.innerHTML = '<div class="date-tasks">' + titleHtml + groupsHtml + '</div>';
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function getToday() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function downloadNotices() {
    var stored = localStorage.getItem('notices');
    var data = stored ? JSON.parse(stored) : NOTICES;
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'notice_' + getToday() + '.json'; a.click();
    URL.revokeObjectURL(url);
  }

  function uploadNotices() {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          localStorage.setItem('notices', JSON.stringify(data));
          openId = null;
          render();
        } catch(err) { alert('JSON 형식이 올바르지 않습니다.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function initNoticeDrag() {
    var container = document.getElementById('noticeList');
    if (!container) return;

    var dragEl = null;

    container.addEventListener('dragstart', function(e) {
      dragEl = e.target.closest('[data-id]');
      if (dragEl) setTimeout(function() { dragEl.classList.add('dragging'); }, 0);
    });
    container.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragEl) return;
      var after = getNoticeDragAfter(container, e.clientY);
      if (after == null) container.appendChild(dragEl);
      else container.insertBefore(dragEl, after);
    });
    container.addEventListener('dragend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      var newOrder = Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); });
      saveNoticeOrder(newOrder);
      dragEl = null;
    });

    container.addEventListener('touchstart', function(e) {
      var handle = e.target.closest('.notice-drag-handle');
      if (!handle) return;
      dragEl = handle.closest('[data-id]');
      if (dragEl) dragEl.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
    container.addEventListener('touchmove', function(e) {
      if (!dragEl) return;
      e.preventDefault();
      var y = e.touches[0].clientY;
      var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
      var after = items.find(function(item) {
        var rect = item.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      });
      if (after) container.insertBefore(dragEl, after);
      else container.appendChild(dragEl);
    }, { passive: false });
    container.addEventListener('touchend', function() {
      if (!dragEl) return;
      dragEl.classList.remove('dragging');
      var newOrder = Array.from(container.querySelectorAll('[data-id]'))
        .map(function(el) { return el.getAttribute('data-id'); });
      saveNoticeOrder(newOrder);
      dragEl = null;
    });
  }

  function getNoticeDragAfter(container, y) {
    var items = Array.from(container.querySelectorAll('[data-id]:not(.dragging)'));
    return items.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function saveNoticeOrder(newOrder) {
    var stored = localStorage.getItem('notices');
    var allNotices = stored ? JSON.parse(stored) : NOTICES;
    var sorted = newOrder.map(function(id) {
      return allNotices.find(function(n) { return String(n.id) === id; });
    }).filter(Boolean);
    localStorage.setItem('notices', JSON.stringify(sorted));
  }

  render();
  renderCalendar();
</script>

      navigator.serviceWorker.register('/Dooly/service-worker.js')
        .then(function(reg) { console.log('SW registered'); })
        .catch(function(err) { console.log('SW error:', err); });
    });
  }
</script>
